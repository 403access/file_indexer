[package]
name = "file_indexer"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
walkdir = "2.5"
clap = { version = "4.5", features = ["derive"] }
inquire = "0.7.5"
indicatif = "0.18.0"
dotenvy = "0.15.7"
axum = "0.8.8"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }
tracing-subscriber = "0.3.22"

[dependencies.uuid]
version = "1.23.1"
# Lets you generate random UUIDs
features = ["v4"]
