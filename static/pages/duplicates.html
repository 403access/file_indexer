<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      (function () {
        try {
          var t = localStorage.getItem('fi-theme') || 'system';
          var d = t === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : t;
          document.documentElement.setAttribute('data-theme', d);
          document.documentElement.setAttribute('data-theme-pref', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        try {
          var n = localStorage.getItem('fi-nav-layout');
          if (n !== 'sidebar' && n !== 'topbar') n = 'sidebar';
          document.documentElement.setAttribute('data-nav-layout', n);
        } catch (e) {
          document.documentElement.setAttribute('data-nav-layout', 'sidebar');
        }
      })();
    </script>

    <title>Duplicates - File Indexer</title>
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .merge-btn {
            margin-left: auto;
            flex-shrink: 0;
        }
        .merge-overlay {
            position: fixed; inset: 0;
            background: var(--bg-overlay); z-index: 950;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden;
            transition: opacity var(--duration-normal) var(--ease-in-out),
                        visibility var(--duration-normal) var(--ease-in-out);
            backdrop-filter: blur(3px);
            padding: var(--space-4);
        }
        .merge-overlay.open { opacity: 1; visibility: visible; }
        .merge-panel {
            background: var(--bg-elevated);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-xl);
            width: 90vw; max-width: 900px;
            max-height: 85vh; display: flex; flex-direction: column;
            box-shadow: var(--shadow-lg);
        }
        .merge-header {
            display: flex; align-items: center; gap: 1rem;
            padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-subtle);
        }
        .merge-header h2 { flex: 1; font-size: 1.1rem; color: var(--text-primary); margin: 0; }
        .merge-close {
            background: none; border: none; font-size: 1.3rem;
            cursor: pointer; color: var(--text-secondary); padding: 0.25rem;
        }
        .merge-close:hover { color: var(--text-primary); }
        .merge-dest {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.75rem 1.5rem; border-bottom: 1px solid var(--border-subtle);
            background: var(--bg-muted);
        }
        .merge-dest label { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); }
        .merge-dest input {
            flex: 1; padding: 0.4rem 0.6rem; border: 1px solid var(--border-default);
            border-radius: var(--radius-sm); font-size: 0.85rem; font-family: var(--font-mono);
            background: var(--bg-elevated); color: var(--text-primary);
        }
        .merge-body { flex: 1; overflow-y: auto; padding: 1rem 1.5rem; }
        .merge-dir-group { margin-bottom: 1rem; }
        .merge-dir-label {
            font-size: 0.75rem; font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.03em;
            margin-bottom: 0.4rem;
        }
        .merge-file-row {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.5rem 0.75rem; border-radius: var(--radius-sm);
            border: 1px solid transparent; margin-bottom: 0.3rem;
            font-size: 0.85rem;
        }
        .merge-file-row.keep {
            background: var(--success-muted); border-color: var(--success);
        }
        .merge-file-row.remove {
            background: var(--danger-muted); border-color: var(--border-default); opacity: 0.6;
        }
        .merge-file-check {
            width: 16px; height: 16px; cursor: pointer;
            accent-color: var(--success);
        }
        .merge-file-name { font-weight: 500; min-width: 120px; }
        .merge-file-path {
            flex: 1; color: var(--text-secondary); font-family: var(--font-mono);
            font-size: 0.78rem; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }
        .merge-file-size { color: var(--text-muted); font-family: var(--font-mono); font-size: 0.8rem; }
        .merge-footer {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.75rem 1.5rem; border-top: 1px solid var(--border-subtle);
            background: var(--bg-muted);
        }
        .merge-stats { font-size: 0.8rem; color: var(--text-secondary); }
        .merge-apply { /* uses .btn */ }
        .merge-cancel { /* uses .btn */ }
        .duplicate-controls {
            background: var(--bg-elevated);
            border: 1px solid var(--border-default);
            padding: 1rem 1.25rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xs);
            margin-bottom: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: center;
        }
        .duplicate-controls input[type="text"],
        .duplicate-controls input[type="number"] {
            flex: 1;
            min-width: 140px;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            background: var(--bg-elevated);
            color: var(--text-primary);
        }
        .duplicate-controls select {
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            background: var(--bg-elevated);
            color: var(--text-primary);
        }
        /* primary actions use .btn */
        .duplicate-controls label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .group-files table {
            table-layout: fixed;
            width: 100%;
        }
        .group-files th,
        .group-files td {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .group-files th:nth-child(1),
        .group-files td:nth-child(1) { width: 25%; }
        .group-files th:nth-child(2),
        .group-files td:nth-child(2) { width: auto; }
        .group-files th:nth-child(3),
        .group-files td:nth-child(3) { width: 12%; }
        .group-files th:nth-child(4),
        .group-files td:nth-child(4) { width: 13%; }
        .group-files .size {
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <nav id="sidebar-container"></nav>

    <main>
        <header class="page-header">
            <div class="page-header__titles">
                <h1 class="page-header__title">Duplicate Files</h1>
                <p class="page-header__subtitle">Groups of files with identical content</p>
            </div>
        </header>

        <section class="duplicate-controls toolbar">
            <input type="text" id="dup-search" placeholder="Search by name or path...">
            <label>Min size:
                <input type="number" id="dup-min-size" min="0" value="0" placeholder="Size">
                <select id="dup-min-size-unit">
                    <option value="1">B</option>
                    <option value="1024">KB</option>
                    <option value="1048576">MB</option>
                    <option value="1073741824">GB</option>
                    <option value="1099511627776">TB</option>
                </select>
            </label>
            <label>Extension:
                <input type="text" id="dup-ext" placeholder="e.g. pdf,zip">
            </label>
            <select id="dup-sort">
                <option value="wasted">Sort: wasted</option>
                <option value="size">Sort: size</option>
                <option value="copies">Sort: copies</option>
                <option value="hash">Sort: hash</option>
            </select>
            <select id="dup-order">
                <option value="desc">Descending</option>
                <option value="asc">Ascending</option>
            </select>
            <button type="button" class="btn btn--sm" id="dup-apply">Apply</button>
        </section>

        <section class="results-info" id="results-info" style="display:none;">
            <span id="result-count"></span>
        </section>

        <section class="groups" id="groups"></section>

        <section class="pagination" id="pagination" style="display:none;">
            <button type="button" class="btn btn--secondary btn--sm" id="prev-page" disabled>Previous</button>
            <span id="page-info"></span>
            <button type="button" class="btn btn--secondary btn--sm" id="next-page" disabled>Next</button>
        </section>
    </main>

    <div class="merge-overlay" id="merge-overlay" style="display:none;">
        <div class="merge-panel">
            <div class="merge-header">
                <h2>Merge Duplicates</h2>
                <button class="merge-close" onclick="closeMerge()">&times;</button>
            </div>
            <div class="merge-dest">
                <label>Destination:</label>
                <input type="text" id="merge-dest-path" placeholder="/path/to/merged/output">
            </div>
            <div class="merge-body" id="merge-body"></div>
            <div class="merge-footer">
                <span class="merge-stats" id="merge-stats"></span>
                <button type="button" class="btn btn--success btn--sm merge-apply" id="merge-apply" onclick="applyMerge()">Apply Merge</button>
            </div>
        </div>
    </div>

    <script src="/assets/js/core/file-viewer.js"></script>
    <script>
        const perPage = 20;
        let currentPage = 1;
        let currentGroups = [];

        async function loadDuplicates(page = 1) {
            const q = document.getElementById('dup-search').value.trim();
            const minSize = document.getElementById('dup-min-size').value;
            const minSizeUnit = document.getElementById('dup-min-size-unit').value;
            const ext = document.getElementById('dup-ext').value.trim();
            const sort = document.getElementById('dup-sort').value;
            const order = document.getElementById('dup-order').value;

            const params = new URLSearchParams();
            params.set('page', page);
            params.set('per_page', perPage);
            if (q) params.set('q', q);
            if (minSize && parseInt(minSize, 10) > 0) params.set('min_size', parseInt(minSize, 10) * parseInt(minSizeUnit, 10));
            if (ext) params.set('ext', ext);
            if (sort) params.set('sort', sort);
            if (order) params.set('order', order);

            const res = await fetch(`/api/duplicates?${params.toString()}`);
            if (!res.ok) return;
            const data = await res.json();
            currentPage = data.page;
            currentGroups = data.groups;
            render(data);
        }

        function formatSize(bytes) {
            if (window.SizeFormat) return window.SizeFormat.format(bytes);
            if (bytes === 0 || bytes === '0') return '0 B';
            const n = Number(bytes);
            if (!Number.isFinite(n) || n < 0) return '—';
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.min(Math.floor(Math.log(Math.max(n, 1)) / Math.log(1024)), units.length - 1);
            const value = n / Math.pow(1024, i);
            const text = i === 0 ? String(Math.round(value)) : value.toFixed(2).replace(/\.?0+$/, '');
            return text + ' ' + units[i];
        }

        function formatDate(ts) {
            if (!ts) return '-';
            return new Date(ts * 1000).toLocaleDateString();
        }

        function truncatePath(p) {
            if (!p) return '';
            const parts = p.split('/');
            if (parts.length <= 3) return p;
            return '.../' + parts.slice(-2).join('/');
        }

        function render(data) {
            const container = document.getElementById('groups');
            const info = document.getElementById('results-info');
            const count = document.getElementById('result-count');
            const pagination = document.getElementById('pagination');

            if (data.groups.length === 0) {
                container.innerHTML = '<div class="empty">No duplicates found</div>';
                info.style.display = 'none';
                pagination.style.display = 'none';
                return;
            }

            info.style.display = 'block';
            count.textContent = `${data.total_groups} duplicate group${data.total_groups !== 1 ? 's' : ''}`;
            pagination.style.display = 'flex';

            container.innerHTML = data.groups.map((group, i) => `
                <div class="duplicate-group">
                    <div class="group-header" onclick="toggle(${i})">
                        <span class="group-icon" id="icon-${i}">&#9654;</span>
                        <span class="group-info">
                            <strong>${group.files.length} copies</strong>
                            <span class="hash">${group.hash.substring(0, 12)}...</span>
                            <span class="wasted">${formatSize(group.wasted_bytes)} wasted</span>
                        </span>
                        <span class="group-size">${formatSize(group.files[0].size)} each</span>
                        <button type="button" class="btn btn--success btn--sm merge-btn" onclick="event.stopPropagation(); openMerge(${i})">Merge</button>
                    </div>
                    <div class="group-files" id="files-${i}" style="display:none;">
                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Path</th>
                                    <th>Size</th>
                                    <th>Modified</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${group.files.map(f => `
                                    <tr>
                                        <td class="name">${f.name}</td>
                                        <td class="path" title="${f.path || ''}">${f.path || ''}</td>
                                        <td class="size">${formatSize(f.size)}</td>
                                        <td class="modified">${formatDate(f.modified)}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `).join('');

            const totalPages = Math.ceil(data.total_groups / perPage);
            document.getElementById('page-info').textContent = `Page ${data.page} of ${totalPages}`;
            document.getElementById('prev-page').disabled = data.page <= 1;
            document.getElementById('next-page').disabled = data.page >= totalPages;
        }

        function toggle(i) {
            const files = document.getElementById(`files-${i}`);
            const icon = document.getElementById(`icon-${i}`);
            if (files.style.display === 'none') {
                files.style.display = 'block';
                icon.innerHTML = '&#9660;';
            } else {
                files.style.display = 'none';
                icon.innerHTML = '&#9654;';
            }
        }

        let mergeGroup = null;
        let mergeSelections = {};

        function openMerge(groupIdx) {
            const group = currentGroups[groupIdx];
            if (!group || group.files.length < 2) return;
            mergeGroup = group;

            const byDir = {};
            group.files.forEach(f => {
                const dir = f.path.replace(/\/[^/]+\/?$/, '') || '/';
                if (!byDir[dir]) byDir[dir] = [];
                byDir[dir].push(f);
            });

            mergeSelections = {};
            Object.values(byDir).forEach(files => {
                mergeSelections[files[0].path] = true;
                files.slice(1).forEach(f => { mergeSelections[f.path] = false; });
            });

            const firstDir = Object.keys(byDir)[0] || '';
            const parentDir = firstDir.replace(/\/[^/]+$/, '') || firstDir;
            document.getElementById('merge-dest-path').value = parentDir + '/merged';

            renderMergeBody();
            const overlay = document.getElementById('merge-overlay');
            overlay.style.display = 'flex';
            requestAnimationFrame(() => overlay.classList.add('open'));
        }

        function renderMergeBody() {
            const body = document.getElementById('merge-body');
            const byDir = {};
            mergeGroup.files.forEach(f => {
                const dir = f.path.replace(/\/[^/]+\/?$/, '') || '/';
                if (!byDir[dir]) byDir[dir] = [];
                byDir[dir].push(f);
            });

            let html = '';
            Object.entries(byDir).forEach(([dir, files]) => {
                html += `<div class="merge-dir-group">
                    <div class="merge-dir-label">${truncatePath(dir)}</div>`;
                files.forEach(f => {
                    const isKeep = mergeSelections[f.path];
                    html += `
                        <div class="merge-file-row ${isKeep ? 'keep' : 'remove'}">
                            <input type="checkbox" class="merge-file-check"
                                ${isKeep ? 'checked' : ''}
                                onchange="toggleMergeFile('${f.path.replace(/'/g, "\\'")}', this.checked)">
                            <span class="merge-file-name">${f.name}</span>
                            <span class="merge-file-path" title="${f.path}">${truncatePath(f.path)}</span>
                            <span class="merge-file-size">${formatSize(f.size)}</span>
                        </div>`;
                });
                html += '</div>';
            });
            body.innerHTML = html;
            updateMergeStats();
        }

        function toggleMergeFile(path, checked) {
            mergeSelections[path] = checked;
            renderMergeBody();
        }

        function updateMergeStats() {
            const kept = Object.values(mergeSelections).filter(v => v).length;
            const removed = mergeGroup.files.length - kept;
            const wasted = removed * mergeGroup.files[0].size;
            document.getElementById('merge-stats').textContent =
                `Keeping ${kept} file${kept !== 1 ? 's' : ''}, removing ${removed} (${formatSize(wasted)} freed)`;
        }

        function closeMerge() {
            const overlay = document.getElementById('merge-overlay');
            overlay.classList.remove('open');
            setTimeout(() => { overlay.style.display = 'none'; }, 200);
            mergeGroup = null;
            mergeSelections = {};
        }

        async function applyMerge() {
            const dest = document.getElementById('merge-dest-path').value.trim();
            if (!dest) { alert('Please set a destination path.'); return; }

            const keep = Object.entries(mergeSelections)
                .filter(([_, v]) => v)
                .map(([path]) => path);

            const remove = Object.entries(mergeSelections)
                .filter(([_, v]) => !v)
                .map(([path]) => path);

            if (keep.length === 0) { alert('Keep at least one file.'); return; }

            const btn = document.getElementById('merge-apply');
            btn.disabled = true;
            btn.textContent = 'Merging...';

            try {
                const res = await fetch('/api/merge', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keep, remove, destination: dest })
                });
                if (!res.ok) {
                    const err = await res.text();
                    alert('Merge failed: ' + err);
                } else {
                    const result = await res.json();
                    alert(`Merge complete: ${result.copied} copied, ${result.removed} removed.`);
                    closeMerge();
                    loadDuplicates(currentPage);
                }
            } catch (e) {
                alert('Error: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Apply Merge';
            }
        }

        document.getElementById('dup-apply').addEventListener('click', () => {
            currentPage = 1;
            loadDuplicates(1);
        });

        document.getElementById('dup-search').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                currentPage = 1;
                loadDuplicates(1);
            }
        });

        document.getElementById('prev-page').addEventListener('click', () => {
            if (currentPage > 1) loadDuplicates(currentPage - 1);
        });

        document.getElementById('next-page').addEventListener('click', () => {
            loadDuplicates(currentPage + 1);
        });

        document.getElementById('dup-sort').addEventListener('change', () => {
            currentPage = 1;
            loadDuplicates(1);
        });

        document.getElementById('dup-order').addEventListener('change', () => {
            currentPage = 1;
            loadDuplicates(1);
        });

        document.getElementById('dup-min-size-unit').addEventListener('change', () => {
            currentPage = 1;
            loadDuplicates(1);
        });

        document.getElementById('merge-overlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeMerge();
        });

        loadDuplicates();
    </script>
        <script src="/assets/js/core/theme.js"></script>
    <script src="/assets/js/core/format.js"></script>
    <script src="/assets/js/core/drawer.js"></script>
    <script src="/assets/js/core/sidebar.js"></script>
    <script src="/assets/js/core/status.js"></script>
</body>
</html>
