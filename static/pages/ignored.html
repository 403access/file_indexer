<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      (function () {
        try {
          var t = localStorage.getItem('fi-theme') || 'system';
          var d = t === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : t;
          document.documentElement.setAttribute('data-theme', d);
          document.documentElement.setAttribute('data-theme-pref', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        try {
          var n = localStorage.getItem('fi-nav-layout');
          if (n !== 'sidebar' && n !== 'topbar') n = 'sidebar';
          document.documentElement.setAttribute('data-nav-layout', n);
        } catch (e) {
          document.documentElement.setAttribute('data-nav-layout', 'sidebar');
        }
      })();
    </script>

    <title>Ignored Folders - File Indexer</title>
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        table th { text-align: left; }
        .condition-tag {
            display: inline-block;
            background: var(--info-muted);
            color: var(--info-text);
            border-radius: var(--radius-sm);
            padding: 2px 8px;
            font-size: 12px;
            font-family: var(--font-mono);
        }

        #rules-table tbody tr { cursor: pointer; }
        .ir-section { margin-bottom: 1.25rem; }
        .ir-section-title {
            font-size: 0.75rem; font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.03em;
            margin-bottom: 0.5rem;
        }
        .ir-rule-code {
            font-family: var(--font-mono); font-size: 0.8rem;
            background: var(--bg-muted); padding: 0.5rem 0.75rem; border-radius: var(--radius-sm);
            border: 1px solid var(--border-default); color: var(--text-primary); word-break: break-all;
        }
        .ir-count { font-size: 1.8rem; font-weight: 700; color: var(--accent); }

        .section-heading {
            font-size: var(--font-size-lg);
            font-weight: 600;
            letter-spacing: var(--tracking-tight);
            color: var(--text-primary);
            margin: 0;
        }

        main.ignored-page {
            display: flex;
            flex-direction: column;
            height: 100vh;
            min-height: 0;
            overflow: hidden;
            box-sizing: border-box;
        }

        .ignored-panels {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-height: 0;
            gap: var(--space-4);
            margin-top: 0;
        }

        .ignored-panel {
            min-width: 0;
            min-height: 0;
            flex: 1 1 0;
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
            overflow: hidden;
        }

        .ignored-panel__header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: var(--space-3);
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .ignored-panel .results-info {
            margin: 0;
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
        }

        .ignored-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .toolbar-field {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            min-width: 0;
            height: 32px;
            padding: 0 0.55rem 0 0.5rem;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            background: var(--bg-elevated);
            color: var(--text-muted);
            transition: border-color var(--duration-fast, 0.15s) ease;
        }

        .toolbar-field:focus-within {
            border-color: var(--accent);
            color: var(--text-secondary);
        }

        .toolbar-field--grow {
            flex: 1 1 160px;
            min-width: 140px;
        }

        .toolbar-field--select {
            flex: 0 1 auto;
        }

        .toolbar-field__icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 16px;
            height: 16px;
            opacity: 0.9;
        }

        .toolbar-field__icon svg {
            width: 15px;
            height: 15px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .toolbar-field input[type="search"],
        .toolbar-field input[type="text"],
        .toolbar-field select {
            flex: 1 1 auto;
            min-width: 0;
            height: 100%;
            padding: 0;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-family: inherit;
            font-size: var(--font-size-sm);
            box-shadow: none;
        }

        .toolbar-field select {
            padding-right: 0.25rem;
            cursor: pointer;
        }

        .toolbar-field input:focus,
        .toolbar-field select:focus {
            outline: none;
        }

        /* Hide native search cancel quirks that fight the icon layout */
        .toolbar-field input[type="search"] {
            -webkit-appearance: none;
            appearance: none;
        }

        .toolbar-field input[type="search"]::-webkit-search-decoration,
        .toolbar-field input[type="search"]::-webkit-search-cancel-button {
            -webkit-appearance: none;
        }

        .ignored-panel .results {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .ignored-panel .table-wrap {
            flex: 1 1 auto;
            min-height: 0;
            max-width: 100%;
            overflow: auto;
        }

        .ignored-panel .table thead th {
            position: sticky;
            top: 0;
            z-index: 1;
            background: var(--bg-elevated);
            box-shadow: 0 1px 0 var(--border-default);
        }

        .ignored-panel .empty-state {
            flex: 1 1 auto;
            min-height: 0;
            overflow: auto;
        }

        .ignored-panel .pagination {
            flex-shrink: 0;
            margin-top: 0;
        }

        @media (min-width: 1280px) {
            .ignored-panels {
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                grid-template-rows: minmax(0, 1fr);
                gap: var(--space-6);
                align-items: stretch;
            }

            .ignored-panel {
                height: 100%;
                flex: unset;
            }
        }
    </style>
</head>
<body>
    <nav id="sidebar-container"></nav>

    <main class="ignored-page">
        <div class="ignored-panels">
            <section class="ignored-panel" aria-labelledby="rules-heading">
                <div class="ignored-panel__header">
                    <h2 class="section-heading" id="rules-heading">Ignore Rules</h2>
                    <div class="results-info" id="rules-info" style="display:none;">
                        <span id="rules-count"></span>
                    </div>
                </div>
                <div class="ignored-toolbar" role="search" aria-label="Filter ignore rules">
                    <label class="toolbar-field toolbar-field--grow" title="Search">
                        <span class="toolbar-field__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                        </span>
                        <input type="search" id="rules-search" placeholder="Search name or condition…" autocomplete="off" aria-label="Search rules">
                    </label>
                    <label class="toolbar-field toolbar-field--select" title="Filter">
                        <span class="toolbar-field__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><path d="M4 5h16l-6.5 7.5V19l-3 1.5v-8L4 5z"/></svg>
                        </span>
                        <select id="rules-filter" aria-label="Filter by condition">
                            <option value="all">All rules</option>
                            <option value="conditional">With condition</option>
                            <option value="always">Always skip</option>
                        </select>
                    </label>
                    <label class="toolbar-field toolbar-field--select" title="Sort">
                        <span class="toolbar-field__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><path d="M8 6v12M4.5 9.5 8 6l3.5 3.5M16 18V6M12.5 14.5 16 18l3.5-3.5"/></svg>
                        </span>
                        <select id="rules-sort" aria-label="Sort rules">
                            <option value="name-asc">Name A–Z</option>
                            <option value="name-desc">Name Z–A</option>
                            <option value="count-desc">Count high–low</option>
                            <option value="count-asc">Count low–high</option>
                            <option value="condition-asc">Condition A–Z</option>
                            <option value="condition-desc">Condition Z–A</option>
                        </select>
                    </label>
                </div>
                <div class="results">
                    <div id="no-rules" class="empty-state" style="display:none;">
                        <div class="empty-state__title">No ignore rules configured</div>
                        <p class="empty-state__desc">Add rules in Settings</p>
                    </div>
                    <div class="table-wrap" id="rules-wrap" style="display:none;">
                        <table id="rules-table" class="table">
                            <thead>
                                <tr>
                                    <th>Folder Name</th>
                                    <th>Condition File</th>
                                    <th>Description</th>
                                    <th>Ignored Count</th>
                                </tr>
                            </thead>
                            <tbody id="rules-body"></tbody>
                        </table>
                    </div>
                </div>
                <div class="pagination" id="rules-pagination" style="display:none;">
                    <button type="button" id="rules-prev" class="btn btn--secondary btn--sm" disabled>Previous</button>
                    <span id="rules-page-info"></span>
                    <button type="button" id="rules-next" class="btn btn--secondary btn--sm" disabled>Next</button>
                </div>
            </section>

            <section class="ignored-panel" aria-labelledby="skipped-heading">
                <div class="ignored-panel__header">
                    <h2 class="section-heading" id="skipped-heading">Skipped Paths</h2>
                    <div class="results-info" id="skipped-info" style="display:none;">
                        <span id="skipped-count"></span>
                    </div>
                </div>
                <div class="ignored-toolbar" role="search" aria-label="Filter skipped paths">
                    <label class="toolbar-field toolbar-field--grow" title="Search">
                        <span class="toolbar-field__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                        </span>
                        <input type="search" id="skipped-search" placeholder="Search path or error…" autocomplete="off" aria-label="Search skipped paths">
                    </label>
                    <label class="toolbar-field toolbar-field--select" title="Filter">
                        <span class="toolbar-field__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><path d="M4 5h16l-6.5 7.5V19l-3 1.5v-8L4 5z"/></svg>
                        </span>
                        <select id="skipped-filter" aria-label="Search field">
                            <option value="both">Path &amp; error</option>
                            <option value="path">Path only</option>
                            <option value="error">Error only</option>
                        </select>
                    </label>
                    <label class="toolbar-field toolbar-field--select" title="Sort">
                        <span class="toolbar-field__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><path d="M8 6v12M4.5 9.5 8 6l3.5 3.5M16 18V6M12.5 14.5 16 18l3.5-3.5"/></svg>
                        </span>
                        <select id="skipped-sort" aria-label="Sort skipped paths">
                            <option value="path-asc">Path A–Z</option>
                            <option value="path-desc">Path Z–A</option>
                            <option value="error-asc">Error A–Z</option>
                            <option value="error-desc">Error Z–A</option>
                        </select>
                    </label>
                </div>
                <div class="results">
                    <div id="no-skipped" class="empty-state" style="display:none;">
                        <div class="empty-state__title">No skipped paths</div>
                    </div>
                    <div class="table-wrap" id="skipped-wrap" style="display:none;">
                        <table id="skipped-table" class="table">
                            <thead>
                                <tr>
                                    <th>Path</th>
                                    <th>Error</th>
                                </tr>
                            </thead>
                            <tbody id="skipped-body"></tbody>
                        </table>
                    </div>
                </div>
                <div class="pagination" id="skipped-pagination" style="display:none;">
                    <button type="button" id="skipped-prev" class="btn btn--secondary btn--sm" disabled>Previous</button>
                    <span id="skipped-page-info"></span>
                    <button type="button" id="skipped-next" class="btn btn--secondary btn--sm" disabled>Next</button>
                </div>
            </section>
        </div>
    </main>

    <script src="/assets/js/core/theme.js"></script>
    <script src="/assets/js/core/format.js"></script>
    <script src="/assets/js/core/drawer.js"></script>
    <script src="/assets/js/core/sidebar.js"></script>
    <script src="/assets/js/core/status.js"></script>

    <script>
        const RULES_PER_PAGE = 50;
        const SKIPPED_PER_PAGE = 50;
        let allRules = [];
        let filteredRules = [];
        let rulesPage = 1;
        let skippedPage = 1;
        let skippedSearchTimer = null;

        function getRulesQuery() {
            return {
                q: (document.getElementById('rules-search').value || '').trim().toLowerCase(),
                filter: document.getElementById('rules-filter').value || 'all',
                sort: document.getElementById('rules-sort').value || 'name-asc',
            };
        }

        function applyRulesFilters() {
            const { q, filter, sort } = getRulesQuery();
            let list = allRules.slice();

            if (filter === 'conditional') {
                list = list.filter((r) => r.condition);
            } else if (filter === 'always') {
                list = list.filter((r) => !r.condition);
            }

            if (q) {
                list = list.filter((r) => {
                    const name = (r.name || '').toLowerCase();
                    const cond = (r.condition || '').toLowerCase();
                    return name.includes(q) || cond.includes(q);
                });
            }

            const [field, dir] = sort.split('-');
            const mult = dir === 'desc' ? -1 : 1;
            list.sort((a, b) => {
                if (field === 'count') {
                    return ((a.ignore_count || 0) - (b.ignore_count || 0)) * mult;
                }
                if (field === 'condition') {
                    const ac = (a.condition || '').toLowerCase();
                    const bc = (b.condition || '').toLowerCase();
                    return ac.localeCompare(bc) * mult;
                }
                return (a.name || '').toLowerCase().localeCompare((b.name || '').toLowerCase()) * mult;
            });

            filteredRules = list;
            renderRulesPage(1);
        }

        function renderRulesPage(page = 1) {
            const noRules = document.getElementById('no-rules');
            const rulesTable = document.getElementById('rules-table');
            const rulesBody = document.getElementById('rules-body');
            const rulesWrap = document.getElementById('rules-wrap');
            const rulesInfo = document.getElementById('rules-info');
            const rulesCount = document.getElementById('rules-count');
            const pagination = document.getElementById('rules-pagination');
            const pageInfo = document.getElementById('rules-page-info');
            const prevBtn = document.getElementById('rules-prev');
            const nextBtn = document.getElementById('rules-next');

            const total = filteredRules.length;
            const totalAll = allRules.length;
            const hasActiveFilter = total !== totalAll
                || (document.getElementById('rules-search').value || '').trim() !== ''
                || document.getElementById('rules-filter').value !== 'all';

            if (totalAll === 0) {
                noRules.innerHTML = `
                    <div class="empty-state__title">No ignore rules configured</div>
                    <p class="empty-state__desc">Add rules in Settings</p>`;
                noRules.style.display = 'block';
                rulesTable.style.display = 'none';
                if (rulesWrap) rulesWrap.style.display = 'none';
                rulesInfo.style.display = 'none';
                pagination.style.display = 'none';
                rulesBody.innerHTML = '';
                return;
            }

            if (total === 0) {
                noRules.innerHTML = `
                    <div class="empty-state__title">No matching rules</div>
                    <p class="empty-state__desc">Try a different search or filter</p>`;
                noRules.style.display = 'block';
                rulesTable.style.display = 'none';
                if (rulesWrap) rulesWrap.style.display = 'none';
                rulesInfo.style.display = 'block';
                rulesCount.textContent = hasActiveFilter
                    ? `0 of ${totalAll.toLocaleString()} rules`
                    : '0 rules';
                pagination.style.display = 'none';
                rulesBody.innerHTML = '';
                return;
            }

            const totalPages = Math.max(1, Math.ceil(total / RULES_PER_PAGE));
            rulesPage = Math.min(Math.max(1, page), totalPages);
            const start = (rulesPage - 1) * RULES_PER_PAGE;
            const pageRules = filteredRules.slice(start, start + RULES_PER_PAGE);

            noRules.style.display = 'none';
            rulesTable.style.display = 'table';
            if (rulesWrap) rulesWrap.style.display = '';
            rulesInfo.style.display = 'block';
            rulesCount.textContent = hasActiveFilter
                ? `${total.toLocaleString()} of ${totalAll.toLocaleString()} rules`
                : `${total.toLocaleString()} rule${total === 1 ? '' : 's'}`;

            rulesBody.innerHTML = '';
            pageRules.forEach((r) => {
                const tr = document.createElement('tr');
                const condition = r.condition
                    ? `<span class="condition-tag">${escapeHtml(r.condition)}</span>`
                    : '<span style="color:var(--text-muted)">—</span>';
                const desc = r.condition
                    ? `Skip ${escapeHtml(r.name)} if ${escapeHtml(r.condition)} exists`
                    : `Skip all ${escapeHtml(r.name)} folders`;
                tr.innerHTML = `
                    <td><code>${escapeHtml(r.name)}</code></td>
                    <td>${condition}</td>
                    <td>${desc}</td>
                    <td>${(r.ignore_count || 0).toLocaleString()}</td>
                `;
                tr.addEventListener('click', () => openRuleSidebar(r));
                rulesBody.appendChild(tr);
            });

            if (totalPages > 1) {
                pagination.style.display = 'flex';
                pageInfo.textContent = `Page ${rulesPage} of ${totalPages}`;
                prevBtn.disabled = rulesPage <= 1;
                nextBtn.disabled = rulesPage >= totalPages;
            } else {
                pagination.style.display = 'none';
            }
        }

        function getSkippedQuery() {
            const sortVal = document.getElementById('skipped-sort').value || 'path-asc';
            const [sort, order] = sortVal.split('-');
            return {
                q: (document.getElementById('skipped-search').value || '').trim(),
                match: document.getElementById('skipped-filter').value || 'both',
                sort: sort || 'path',
                order: order || 'asc',
            };
        }

        async function loadSkippedPage(page = 1) {
            const noSkipped = document.getElementById('no-skipped');
            const skippedTable = document.getElementById('skipped-table');
            const skippedBody = document.getElementById('skipped-body');
            const skippedWrap = document.getElementById('skipped-wrap');
            const skippedInfo = document.getElementById('skipped-info');
            const skippedCount = document.getElementById('skipped-count');
            const pagination = document.getElementById('skipped-pagination');
            const pageInfo = document.getElementById('skipped-page-info');
            const prevBtn = document.getElementById('skipped-prev');
            const nextBtn = document.getElementById('skipped-next');

            const { q, match, sort, order } = getSkippedQuery();
            const params = new URLSearchParams({
                page: String(page),
                per_page: String(SKIPPED_PER_PAGE),
                match,
                sort,
                order,
            });
            if (q) params.set('q', q);

            try {
                const res = await fetch(`/api/skipped?${params.toString()}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const results = data.results || [];
                const total = data.total ?? 0;
                skippedPage = data.page || page;
                const hasQuery = !!q;

                if (total === 0) {
                    noSkipped.innerHTML = hasQuery
                        ? `<div class="empty-state__title">No matching paths</div>
                           <p class="empty-state__desc">Try a different search or filter</p>`
                        : `<div class="empty-state__title">No skipped paths</div>`;
                    noSkipped.style.display = 'block';
                    skippedTable.style.display = 'none';
                    if (skippedWrap) skippedWrap.style.display = 'none';
                    skippedInfo.style.display = hasQuery ? 'block' : 'none';
                    skippedCount.textContent = hasQuery ? '0 matching' : '';
                    pagination.style.display = 'none';
                    skippedBody.innerHTML = '';
                    return;
                }

                noSkipped.style.display = 'none';
                skippedTable.style.display = 'table';
                if (skippedWrap) skippedWrap.style.display = '';
                skippedInfo.style.display = 'block';
                skippedCount.textContent = hasQuery
                    ? `${total.toLocaleString()} matching`
                    : `${total.toLocaleString()} skipped path${total === 1 ? '' : 's'}`;

                skippedBody.innerHTML = results.map((item) => `
                    <tr>
                        <td><code>${escapeHtml(item.path)}</code></td>
                        <td>${escapeHtml(item.error)}</td>
                    </tr>
                `).join('');

                const totalPages = Math.max(1, Math.ceil(total / (data.per_page || SKIPPED_PER_PAGE)));
                if (totalPages > 1) {
                    pagination.style.display = 'flex';
                    pageInfo.textContent = `Page ${skippedPage} of ${totalPages}`;
                    prevBtn.disabled = skippedPage <= 1;
                    nextBtn.disabled = skippedPage >= totalPages;
                } else {
                    pagination.style.display = 'none';
                }
            } catch (err) {
                noSkipped.innerHTML = '<div class="empty-state__title">Failed to load skipped paths</div>';
                noSkipped.style.display = 'block';
                pagination.style.display = 'none';
            }
        }

        function scheduleSkippedReload() {
            clearTimeout(skippedSearchTimer);
            skippedSearchTimer = setTimeout(() => loadSkippedPage(1), 250);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('rules-prev').addEventListener('click', () => {
                if (rulesPage > 1) renderRulesPage(rulesPage - 1);
            });
            document.getElementById('rules-next').addEventListener('click', () => {
                renderRulesPage(rulesPage + 1);
            });
            document.getElementById('skipped-prev').addEventListener('click', () => {
                if (skippedPage > 1) loadSkippedPage(skippedPage - 1);
            });
            document.getElementById('skipped-next').addEventListener('click', () => {
                loadSkippedPage(skippedPage + 1);
            });

            document.getElementById('rules-search').addEventListener('input', applyRulesFilters);
            document.getElementById('rules-filter').addEventListener('change', applyRulesFilters);
            document.getElementById('rules-sort').addEventListener('change', applyRulesFilters);

            document.getElementById('skipped-search').addEventListener('input', scheduleSkippedReload);
            document.getElementById('skipped-filter').addEventListener('change', () => loadSkippedPage(1));
            document.getElementById('skipped-sort').addEventListener('change', () => loadSkippedPage(1));

            try {
                const res = await fetch('/api/settings');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                allRules = data.ignore_folders || [];
                applyRulesFilters();
            } catch (err) {
                const noRules = document.getElementById('no-rules');
                noRules.innerHTML = '<div class="empty-state__title">Failed to load ignore rules</div>';
                noRules.style.display = 'block';
                document.getElementById('rules-pagination').style.display = 'none';
            }

            loadSkippedPage(1);
        });

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        let ruleDrawer = null;

        function getRuleDrawer() {
            if (ruleDrawer) return ruleDrawer;
            if (typeof Drawer === 'undefined') return null;
            ruleDrawer = Drawer.create({ id: 'ignore-rule-drawer', title: 'Ignore Rule', size: 'md' });
            return ruleDrawer;
        }

        function openRuleSidebar(rule) {
            const raw = rule.condition ? `${rule.name}:${rule.condition}` : rule.name;
            const desc = rule.condition
                ? `Skip ${rule.name} if ${rule.condition} exists`
                : `Skip all ${rule.name} folders`;

            const body = `
                <div class="ir-section">
                    <div class="ir-section-title">Rule</div>
                    <div class="ir-rule-code">${escapeHtml(raw)}</div>
                </div>
                <div class="ir-section">
                    <div class="meta-row">
                        <span class="meta-row__label">Folder</span>
                        <span class="meta-row__value"><code>${escapeHtml(rule.name)}</code></span>
                    </div>
                    <div class="meta-row">
                        <span class="meta-row__label">Condition</span>
                        <span class="meta-row__value">${
                            rule.condition
                                ? `<span class="condition-tag">${escapeHtml(rule.condition)}</span>`
                                : '<span class="text-muted">—</span>'
                        }</span>
                    </div>
                    <div class="meta-row">
                        <span class="meta-row__label">Ignored</span>
                        <span class="meta-row__value ir-count">${(rule.ignore_count || 0).toLocaleString()}</span>
                    </div>
                </div>
                <div class="ir-section">
                    <div class="ir-section-title">Description</div>
                    <div class="meta-row__value">${escapeHtml(desc)}</div>
                </div>
            `;

            const drawer = getRuleDrawer();
            if (drawer) {
                drawer.setTitle('Ignore Rule').setMeta('').setBody(body).open();
                return;
            }
            console.warn('Drawer component not loaded');
        }

        function closeRuleSidebar() {
            if (ruleDrawer) ruleDrawer.close();
        }
    </script>
</body>
</html>
