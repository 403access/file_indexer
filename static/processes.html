<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      (function () {
        try {
          var t = localStorage.getItem('fi-theme') || 'system';
          var d = t === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : t;
          document.documentElement.setAttribute('data-theme', d);
          document.documentElement.setAttribute('data-theme-pref', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        try {
          var n = localStorage.getItem('fi-nav-layout');
          if (n !== 'sidebar' && n !== 'topbar') n = 'sidebar';
          document.documentElement.setAttribute('data-nav-layout', n);
        } catch (e) {
          document.documentElement.setAttribute('data-nav-layout', 'sidebar');
        }
      })();
    </script>
    <title>Processes - File Indexer</title>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/processes.css">
</head>
<body>
    <nav id="sidebar-container"></nav>

    <main>
        <header class="page-header">
            <div class="page-header__titles">
                <h1 class="page-header__title">Background Processes</h1>
                <p class="page-header__subtitle">Monitor indexing, scans, and other jobs</p>
            </div>
            <div class="page-header__actions">
                <button type="button" class="btn btn--secondary btn--sm" onclick="clearCompleted()">Clear completed</button>
                <button type="button" class="btn btn--sm" onclick="refreshProcesses()">Refresh</button>
            </div>
        </header>

        <div class="results-info" id="processes-summary"></div>

        <div class="processes-toolbar" role="search" aria-label="Filter processes">
            <label class="toolbar-field toolbar-field--grow" title="Search">
                <span class="toolbar-field__icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                </span>
                <input type="search" id="processes-search" placeholder="Search name, category, message, id…" autocomplete="off" aria-label="Search processes">
            </label>
            <label class="toolbar-field toolbar-field--select" title="Filter">
                <span class="toolbar-field__icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M4 5h16l-6.5 7.5V19l-3 1.5v-8L4 5z"/></svg>
                </span>
                <select id="processes-filter" aria-label="Filter by status">
                    <option value="all">All statuses</option>
                    <option value="active">Running</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                    <option value="failed">Failed</option>
                    <option value="paused">Paused</option>
                </select>
            </label>
            <label class="toolbar-field toolbar-field--select" title="Category">
                <span class="toolbar-field__icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h14"/><circle cx="18" cy="12" r="2"/><circle cx="20" cy="18" r="2"/></svg>
                </span>
                <select id="processes-category" aria-label="Filter by category">
                    <option value="all">All categories</option>
                </select>
            </label>
            <label class="toolbar-field toolbar-field--select" title="Sort">
                <span class="toolbar-field__icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M8 6v12M4.5 9.5 8 6l3.5 3.5M16 18V6M12.5 14.5 16 18l3.5-3.5"/></svg>
                </span>
                <select id="processes-sort" aria-label="Sort processes">
                    <option value="id-desc">ID high–low</option>
                    <option value="id-asc">ID low–high</option>
                    <option value="name-asc">Name A–Z</option>
                    <option value="name-desc">Name Z–A</option>
                    <option value="status-asc">Status A–Z</option>
                    <option value="status-desc">Status Z–A</option>
                    <option value="category-asc">Category A–Z</option>
                    <option value="category-desc">Category Z–A</option>
                    <option value="started-desc">Started newest</option>
                    <option value="started-asc">Started oldest</option>
                </select>
            </label>
        </div>

        <div class="processes-layout">
            <div class="processes-cards-col">
                <div id="process-cards"></div>
            </div>
            <div class="processes-table-wrapper">
                <table class="processes-table">
                    <colgroup>
                        <col style="width:5%">
                        <col style="width:18%">
                        <col style="width:12%">
                        <col style="width:10%">
                        <col style="width:11%">
                        <col style="width:20%">
                        <col style="width:12%">
                        <col style="width:12%">
                    </colgroup>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Progress</th>
                            <th>Message</th>
                            <th>Started</th>
                            <th>Finished</th>
                        </tr>
                    </thead>
                    <tbody id="processes-tbody">
                        <tr><td colspan="8" class="empty-msg">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="process-sidebar-overlay" id="process-sidebar-overlay" onclick="closeProcessSidebar()"></div>
    <aside class="process-sidebar" id="process-sidebar" role="dialog" aria-modal="true" aria-labelledby="process-sidebar-title">
        <div class="process-sidebar-header">
            <h3 id="process-sidebar-title">Process Details</h3>
            <button type="button" class="drawer__close" onclick="closeProcessSidebar()" aria-label="Close">&times;</button>
        </div>
        <div class="process-sidebar-body" id="process-sidebar-body">
            <div class="empty-msg">Loading…</div>
        </div>
    </aside>

    <script src="/js/theme.js"></script>
    <script src="/js/drawer.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/processes.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/status.js"></script>
</body>
</html>
