<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processes - File Indexer</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/processes.css">
</head>
<body>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1>File Indexer</h1>
        <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Toggle menu">☰</button>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Browse</div>
          <a href="/" class="nav-item">Dashboard</a>
          <a href="/search.html" class="nav-item">Search</a>
          <a href="/explorer.html" class="nav-item">Explorer</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Duplicates</div>
          <a href="/duplicates.html" class="nav-item">Duplicates</a>
          <a href="/duplicate-folders.html" class="nav-item">Folders</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Data</div>
          <a href="/skipped.html" class="nav-item">Skipped</a>
          <a href="/ignored.html" class="nav-item">Ignored</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">System</div>
          <a href="/status.html" class="nav-item">Status</a>
          <a href="/processes.html" class="nav-item active">Processes</a>
          <a href="/logs.html" class="nav-item">Logs</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Config</div>
          <a href="/settings.html" class="nav-item">Settings</a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <span class="sidebar-footer-text">Indexer</span>
        <span id="status-dot" class="status-dot idle" title="Idle"></span>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <main>
        <div class="processes-header">
            <h2>Background Processes</h2>
            <div class="processes-actions">
                <button class="processes-btn" onclick="clearCompleted()" style="background:#95a5a6">Clear completed</button>
                <button class="processes-btn" onclick="refreshProcesses()" style="background:#3498db">Refresh</button>
            </div>
        </div>
        <div class="processes-summary" id="processes-summary"></div>
        <div id="process-cards"></div>
        <div class="processes-table-wrapper">
            <table class="processes-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Progress</th>
                        <th>Message</th>
                        <th>Started</th>
                        <th>Finished</th>
                    </tr>
                </thead>
                <tbody id="processes-tbody">
                    <tr><td colspan="8" class="empty-msg">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <div class="process-sidebar-overlay" id="process-sidebar-overlay" onclick="closeProcessSidebar()"></div>
    <aside class="process-sidebar" id="process-sidebar">
        <div class="process-sidebar-header">
            <h3 id="process-sidebar-title">Process Details</h3>
            <button class="merge-close" onclick="closeProcessSidebar()">&times;</button>
        </div>
        <div class="process-sidebar-body" id="process-sidebar-body">
            <div class="empty-msg">Loading...</div>
        </div>
    </aside>

    <script src="/js/app.js"></script>
    <script src="/js/processes.js"></script>
    <script src="/js/status.js"></script>
</body>
</html>
