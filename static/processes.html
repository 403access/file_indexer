<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      (function () {
        try {
          var t = localStorage.getItem('fi-theme') || 'system';
          var d = t === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : t;
          document.documentElement.setAttribute('data-theme', d);
          document.documentElement.setAttribute('data-theme-pref', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        try {
          var n = localStorage.getItem('fi-nav-layout');
          if (n !== 'sidebar' && n !== 'topbar') n = 'sidebar';
          document.documentElement.setAttribute('data-nav-layout', n);
        } catch (e) {
          document.documentElement.setAttribute('data-nav-layout', 'sidebar');
        }
      })();
    </script>
    <title>Processes - File Indexer</title>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/processes.css">
</head>
<body>
    <nav id="sidebar-container"></nav>

    <main>
        <header class="page-header">
            <div class="page-header__titles">
                <h1 class="page-header__title">Background Processes</h1>
                <p class="page-header__subtitle">Monitor indexing, scans, and other jobs</p>
            </div>
            <div class="page-header__actions">
                <button type="button" class="btn btn--secondary btn--sm" onclick="clearCompleted()">Clear completed</button>
                <button type="button" class="btn btn--sm" onclick="refreshProcesses()">Refresh</button>
            </div>
        </header>

        <div class="results-info" id="processes-summary"></div>

        <div class="processes-layout">
            <div class="processes-cards-col">
                <div id="process-cards"></div>
            </div>
            <div class="processes-table-wrapper">
                <table class="processes-table">
                    <colgroup>
                        <col style="width:5%">
                        <col style="width:18%">
                        <col style="width:12%">
                        <col style="width:10%">
                        <col style="width:11%">
                        <col style="width:20%">
                        <col style="width:12%">
                        <col style="width:12%">
                    </colgroup>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Progress</th>
                            <th>Message</th>
                            <th>Started</th>
                            <th>Finished</th>
                        </tr>
                    </thead>
                    <tbody id="processes-tbody">
                        <tr><td colspan="8" class="empty-msg">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="process-sidebar-overlay" id="process-sidebar-overlay" onclick="closeProcessSidebar()"></div>
    <aside class="process-sidebar" id="process-sidebar" role="dialog" aria-modal="true" aria-labelledby="process-sidebar-title">
        <div class="process-sidebar-header">
            <h3 id="process-sidebar-title">Process Details</h3>
            <button type="button" class="drawer__close" onclick="closeProcessSidebar()" aria-label="Close">&times;</button>
        </div>
        <div class="process-sidebar-body" id="process-sidebar-body">
            <div class="empty-msg">Loading…</div>
        </div>
    </aside>

    <script src="/js/theme.js"></script>
    <script src="/js/drawer.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/processes.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/status.js"></script>
</body>
</html>
