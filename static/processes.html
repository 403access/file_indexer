<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processes - File Indexer</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/processes.css">
</head>
<body>
    <nav id="sidebar-container"></nav>

    <main>
        <div class="processes-header">
            <h2>Background Processes</h2>
            <div class="processes-actions">
                <button class="processes-btn" onclick="clearCompleted()" style="background:#95a5a6">Clear completed</button>
                <button class="processes-btn" onclick="refreshProcesses()" style="background:#3498db">Refresh</button>
            </div>
        </div>
        <div class="processes-summary" id="processes-summary"></div>
        <div class="processes-layout">
            <div class="processes-cards-col">
                <div id="process-cards"></div>
            </div>
            <div class="processes-table-wrapper">
                <table class="processes-table">
                    <colgroup>
                        <col style="width:5%">
                        <col style="width:18%">
                        <col style="width:12%">
                        <col style="width:10%">
                        <col style="width:11%">
                        <col style="width:20%">
                        <col style="width:12%">
                        <col style="width:12%">
                    </colgroup>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Progress</th>
                            <th>Message</th>
                            <th>Started</th>
                            <th>Finished</th>
                        </tr>
                    </thead>
                    <tbody id="processes-tbody">
                        <tr><td colspan="8" class="empty-msg">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="process-sidebar-overlay" id="process-sidebar-overlay" onclick="closeProcessSidebar()"></div>
    <aside class="process-sidebar" id="process-sidebar">
        <div class="process-sidebar-header">
            <h3 id="process-sidebar-title">Process Details</h3>
            <button class="merge-close" onclick="closeProcessSidebar()">&times;</button>
        </div>
        <div class="process-sidebar-body" id="process-sidebar-body">
            <div class="empty-msg">Loading...</div>
        </div>
    </aside>

    <script src="/js/app.js"></script>
    <script src="/js/processes.js">    </script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/status.js"></script>
</body>
</html>
