<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Indexer</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        tr.clickable { cursor: pointer; }
        tr.clickable:hover { background: #f0f4f8; }

        .folder-sidebar-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.3); z-index: 999;
            opacity: 0; transition: opacity 0.2s;
        }
        .folder-sidebar-overlay.open { opacity: 1; }

        .folder-sidebar {
            position: fixed; top: 0; right: 0;
            width: 450px; max-width: 90vw; height: 100vh;
            background: white;
            box-shadow: -4px 0 20px rgba(0,0,0,0.15);
            display: flex; flex-direction: column;
            transform: translateX(100%); transition: transform 0.25s ease;
            z-index: 1000;
        }
        .folder-sidebar.open { transform: translateX(0); }

        .fs-header {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 1rem 1.25rem; border-bottom: 1px solid #eee;
        }
        .fs-close {
            background: none; border: none; font-size: 1.3rem;
            cursor: pointer; color: #666; padding: 0.25rem;
        }
        .fs-close:hover { color: #333; }
        .fs-title {
            font-size: 1.1rem; font-weight: 600; color: #2c3e50;
            flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        .fs-meta {
            padding: 0.75rem 1.25rem; border-bottom: 1px solid #eee;
            background: #fafbfc;
        }
        .fs-meta-row {
            display: flex; align-items: baseline; gap: 0.75rem;
            margin-bottom: 0.35rem;
        }
        .fs-meta-row:last-child { margin-bottom: 0; }
        .fs-meta-label {
            font-size: 0.75rem; font-weight: 600; color: #888;
            text-transform: uppercase; letter-spacing: 0.03em;
            width: 80px; flex-shrink: 0;
        }
        .fs-meta-value {
            font-size: 0.85rem; color: #333;
        }
        .fs-path {
            font-family: monospace; font-size: 0.78rem;
            word-break: break-all; color: #666;
        }

        .fs-content {
            flex: 1; overflow-y: auto; padding: 0.75rem 1.25rem;
        }
        .fs-section-title {
            font-size: 0.75rem; font-weight: 600; color: #888;
            text-transform: uppercase; letter-spacing: 0.03em;
            margin-bottom: 0.5rem;
        }

        .fs-file-list {
            display: flex; flex-direction: column; gap: 0.25rem;
        }
        .fs-file-row {
            display: flex; align-items: center; gap: 0.5rem;
            padding: 0.4rem 0.5rem; border-radius: 4px;
            cursor: pointer; font-size: 0.85rem;
        }
        .fs-file-row:hover { background: #f0f4f8; }
        .fs-file-icon { flex-shrink: 0; width: 1.2rem; text-align: center; }
        .fs-file-name {
            flex: 1; min-width: 0;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .fs-file-size {
            color: #999; font-family: monospace; font-size: 0.78rem;
            flex-shrink: 0;
        }
        .fs-empty {
            color: #999; font-size: 0.85rem; padding: 1rem 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1>File Indexer</h1>
        <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Toggle menu">☰</button>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Browse</div>
          <a href="/" class="nav-item">Dashboard</a>
          <a href="/search.html" class="nav-item active">Search</a>
          <a href="/explorer.html" class="nav-item">Explorer</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Duplicates</div>
          <a href="/duplicates.html" class="nav-item">Duplicates</a>
          <a href="/duplicate-folders.html" class="nav-item">Folders</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Data</div>
          <a href="/skipped.html" class="nav-item">Skipped</a>
          <a href="/ignored.html" class="nav-item">Ignored</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">System</div>
          <a href="/status.html" class="nav-item">Status</a>
          <a href="/processes.html" class="nav-item">Processes</a>
          <a href="/logs.html" class="nav-item">Logs</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Config</div>
          <a href="/settings.html" class="nav-item">Settings</a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <span class="sidebar-footer-text">Indexer</span>
        <span id="status-dot" class="status-dot idle" title="Idle"></span>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <main>
        <section class="search-controls">
            <form id="search-form">
                <div class="form-row">
                    <input type="text" id="search-name" placeholder="Search by name..." autofocus>
                    <select id="search-type">
                        <option value="both">Files & Folders</option>
                        <option value="files">Files only</option>
                        <option value="folders">Folders only</option>
                    </select>
                    <select id="search-pattern">
                        <option value="contains">Contains</option>
                        <option value="exact">Exact</option>
                        <option value="starts_with">Starts with</option>
                        <option value="ends_with">Ends with</option>
                    </select>
                    <button type="submit">Search</button>
                </div>
                <div class="form-row">
                    <label>Sort:</label>
                    <select id="search-sort">
                        <option value="name">Name</option>
                        <option value="size">Size</option>
                        <option value="modified">Modified</option>
                        <option value="path">Path</option>
                    </select>
                    <select id="search-order">
                        <option value="asc">Ascending</option>
                        <option value="desc">Descending</option>
                    </select>
                </div>
            </form>
        </section>

        <section class="results-info" id="results-info" style="display:none;">
            <span id="result-count"></span>
        </section>

        <section class="results">
            <table id="results-table" style="display:none;">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Path</th>
                        <th>Size</th>
                        <th>Modified</th>
                        <th>Type</th>
                    </tr>
                </thead>
                <tbody id="results-body"></tbody>
            </table>
            <div id="no-results" style="display:none;">No results found</div>
        </section>

        <section class="pagination" id="pagination" style="display:none;">
            <button id="prev-page" disabled>Previous</button>
            <span id="page-info"></span>
            <button id="next-page" disabled>Next</button>
        </section>
    </main>

    <script src="/js/status.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/search.js"></script>
</body>
</html>
