<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      (function () {
        try {
          var t = localStorage.getItem('fi-theme') || 'system';
          var d = t === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : t;
          document.documentElement.setAttribute('data-theme', d);
          document.documentElement.setAttribute('data-theme-pref', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        try {
          var n = localStorage.getItem('fi-nav-layout');
          if (n !== 'sidebar' && n !== 'topbar') n = 'sidebar';
          document.documentElement.setAttribute('data-nav-layout', n);
        } catch (e) {
          document.documentElement.setAttribute('data-nav-layout', 'sidebar');
        }
      })();
    </script>

    <title>Ignored Folders - File Indexer</title>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .ignored-stats {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .ignored-stat {
            background: var(--bg-elevated);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-lg);
            padding: 16px 24px;
            text-align: center;
            min-width: 160px;
        }
        .ignored-stat .value {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .ignored-stat .label {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .ignored-stat.rules .value { color: var(--accent); }
        .ignored-stat.skipped .value { color: var(--danger); }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            margin-top: 32px;
        }
        table th { text-align: left; }
        .condition-tag {
            display: inline-block;
            background: var(--info-muted);
            color: var(--info-text);
            border-radius: var(--radius-sm);
            padding: 2px 8px;
            font-size: 12px;
            font-family: var(--font-mono);
        }

        /* Ignore Rule detail sidebar */
        /* Ignore rule drawer content */
        #rules-table tbody tr { cursor: pointer; }
        .ir-section { margin-bottom: 1.25rem; }
        .ir-section-title {
            font-size: 0.75rem; font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.03em;
            margin-bottom: 0.5rem;
        }
        .ir-rule-code {
            font-family: var(--font-mono); font-size: 0.8rem;
            background: var(--bg-muted); padding: 0.5rem 0.75rem; border-radius: var(--radius-sm);
            border: 1px solid var(--border-default); color: var(--text-primary); word-break: break-all;
        }
        .ir-meta-row {
            display: flex; align-items: baseline; gap: 0.75rem;
            margin-bottom: 0.5rem;
        }
        .ir-meta-row:last-child { margin-bottom: 0; }
        .ir-meta-label {
            font-size: 0.75rem; font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.03em;
            width: 110px; flex-shrink: 0;
        }
        .ir-meta-value {
            font-size: 0.85rem; color: var(--text-primary); word-break: break-all;
        }
        .ir-count { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
    
        .section-heading {
            font-size: var(--font-size-lg);
            font-weight: 600;
            letter-spacing: var(--tracking-tight);
            color: var(--text-primary);
            margin: var(--space-5) 0 var(--space-3);
        }
    </style>
</head>
<body>
    <nav id="sidebar-container"></nav>

    <main>
        <header class="page-header">
            <div class="page-header__titles">
                <h1 class="page-header__title">Ignored</h1>
                <p class="page-header__subtitle">Ignore rules and paths skipped by them</p>
            </div>
        </header>

        <section class="ignored-stats stat-grid">
            <div class="stat-card stat-card--accent">
                <div class="stat-card__value" id="stat-rules">-</div>
                <div class="stat-card__label">Ignore Rules</div>
            </div>
            <div class="stat-card stat-card--danger">
                <div class="stat-card__value" id="stat-skipped">-</div>
                <div class="stat-card__label">Skipped Paths</div>
            </div>
        </section>

        <h2 class="section-heading">Ignore Rules</h2>
        <section class="results">
            <div id="no-rules" class="empty-state" style="display:none;">
                <div class="empty-state__title">No ignore rules configured</div>
                <p class="empty-state__desc">Add rules in Settings</p>
            </div>
            <div class="table-wrap" id="rules-wrap" style="display:none;">
                <table id="rules-table" class="table">
                    <thead>
                        <tr>
                            <th>Folder Name</th>
                            <th>Condition File</th>
                            <th>Description</th>
                            <th>Ignored Count</th>
                        </tr>
                    </thead>
                    <tbody id="rules-body"></tbody>
                </table>
            </div>
        </section>

        <h2 class="section-heading">Skipped Paths</h2>
        <section class="results-info" id="skipped-info" style="display:none;">
            <span id="skipped-count"></span>
        </section>
        <section class="results">
            <div id="no-skipped" class="empty-state" style="display:none;">
                <div class="empty-state__title">No skipped paths</div>
            </div>
            <div class="table-wrap" id="skipped-wrap" style="display:none;">
                <table id="skipped-table" class="table">
                    <thead>
                        <tr>
                            <th>Path</th>
                            <th>Error</th>
                        </tr>
                    </thead>
                    <tbody id="skipped-body"></tbody>
                </table>
            </div>
        </section>
        <section class="pagination" id="skipped-pagination" style="display:none;">
            <button type="button" id="skipped-prev" class="btn btn--secondary btn--sm" disabled>Previous</button>
            <span id="skipped-page-info"></span>
            <button type="button" id="skipped-next" class="btn btn--secondary btn--sm" disabled>Next</button>
        </section>
    </main>

    <script src="/js/theme.js"></script>
    <script src="/js/drawer.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/status.js"></script>

    <script>
        const SKIPPED_PER_PAGE = 50;
        let skippedPage = 1;

        async function loadSkippedPage(page = 1) {
            const noSkipped = document.getElementById('no-skipped');
            const skippedTable = document.getElementById('skipped-table');
            const skippedBody = document.getElementById('skipped-body');
            const skippedWrap = document.getElementById('skipped-wrap');
            const skippedInfo = document.getElementById('skipped-info');
            const skippedCount = document.getElementById('skipped-count');
            const pagination = document.getElementById('skipped-pagination');
            const pageInfo = document.getElementById('skipped-page-info');
            const prevBtn = document.getElementById('skipped-prev');
            const nextBtn = document.getElementById('skipped-next');

            try {
                const res = await fetch(`/api/skipped?page=${page}&per_page=${SKIPPED_PER_PAGE}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const results = data.results || [];
                const total = data.total ?? 0;
                skippedPage = data.page || page;

                document.getElementById('stat-skipped').textContent = total.toLocaleString();

                if (total === 0) {
                    noSkipped.style.display = 'block';
                    skippedTable.style.display = 'none';
                    if (skippedWrap) skippedWrap.style.display = 'none';
                    skippedInfo.style.display = 'none';
                    pagination.style.display = 'none';
                    return;
                }

                noSkipped.style.display = 'none';
                skippedTable.style.display = 'table';
                if (skippedWrap) skippedWrap.style.display = '';
                skippedInfo.style.display = 'block';
                skippedCount.textContent = `${total.toLocaleString()} skipped path${total === 1 ? '' : 's'}`;

                skippedBody.innerHTML = results.map((item) => `
                    <tr>
                        <td><code>${escapeHtml(item.path)}</code></td>
                        <td>${escapeHtml(item.error)}</td>
                    </tr>
                `).join('');

                const totalPages = Math.max(1, Math.ceil(total / (data.per_page || SKIPPED_PER_PAGE)));
                if (totalPages > 1) {
                    pagination.style.display = 'flex';
                    pageInfo.textContent = `Page ${skippedPage} of ${totalPages}`;
                    prevBtn.disabled = skippedPage <= 1;
                    nextBtn.disabled = skippedPage >= totalPages;
                } else {
                    pagination.style.display = 'none';
                }
            } catch (err) {
                noSkipped.innerHTML = '<div class="empty-state__title">Failed to load skipped paths</div>';
                noSkipped.style.display = 'block';
                pagination.style.display = 'none';
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const noRules = document.getElementById('no-rules');
            const rulesTable = document.getElementById('rules-table');
            const rulesBody = document.getElementById('rules-body');

            // Load ignore rules
            try {
                const res = await fetch('/api/settings');
                const data = await res.json();
                const rules = data.ignore_folders || [];

                document.getElementById('stat-rules').textContent = rules.length;

                if (rules.length === 0) {
                    noRules.style.display = 'block';
                } else {
                    rulesTable.style.display = 'table';
                    const rulesWrap = document.getElementById('rules-wrap');
                    if (rulesWrap) rulesWrap.style.display = '';
                    rules.forEach(r => {
                        const tr = document.createElement('tr');
                        const condition = r.condition
                            ? `<span class="condition-tag">${escapeHtml(r.condition)}</span>`
                            : '<span style="color:var(--text-muted)">—</span>';
                        const desc = r.condition
                            ? `Skip ${escapeHtml(r.name)} if ${escapeHtml(r.condition)} exists`
                            : `Skip all ${escapeHtml(r.name)} folders`;
                        tr.innerHTML = `
                            <td><code>${escapeHtml(r.name)}</code></td>
                            <td>${condition}</td>
                            <td>${desc}</td>
                            <td>${(r.ignore_count || 0).toLocaleString()}</td>
                        `;
                        tr.addEventListener('click', () => openRuleSidebar(r));
                        rulesBody.appendChild(tr);
                    });
                }
            } catch (err) {
                noRules.textContent = 'Failed to load ignore rules';
                noRules.style.display = 'block';
            }

            document.getElementById('skipped-prev').addEventListener('click', () => {
                if (skippedPage > 1) loadSkippedPage(skippedPage - 1);
            });
            document.getElementById('skipped-next').addEventListener('click', () => {
                loadSkippedPage(skippedPage + 1);
            });

            // Load first page of skipped paths
            loadSkippedPage(1);
        });

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Ignore rule detail — shared Drawer component
        let ruleDrawer = null;

        function getRuleDrawer() {
            if (ruleDrawer) return ruleDrawer;
            if (typeof Drawer === 'undefined') return null;
            ruleDrawer = Drawer.create({ id: 'ignore-rule-drawer', title: 'Ignore Rule', size: 'md' });
            return ruleDrawer;
        }

        function openRuleSidebar(rule) {
            const raw = rule.condition ? `${rule.name}:${rule.condition}` : rule.name;
            const desc = rule.condition
                ? `Skip ${rule.name} if ${rule.condition} exists`
                : `Skip all ${rule.name} folders`;

            const body = `
                <div class="ir-section">
                    <div class="ir-section-title">Rule</div>
                    <div class="ir-rule-code">${escapeHtml(raw)}</div>
                </div>
                <div class="ir-section">
                    <div class="meta-row">
                        <span class="meta-row__label">Folder</span>
                        <span class="meta-row__value"><code>${escapeHtml(rule.name)}</code></span>
                    </div>
                    <div class="meta-row">
                        <span class="meta-row__label">Condition</span>
                        <span class="meta-row__value">${
                            rule.condition
                                ? `<span class="condition-tag">${escapeHtml(rule.condition)}</span>`
                                : '<span class="text-muted">—</span>'
                        }</span>
                    </div>
                    <div class="meta-row">
                        <span class="meta-row__label">Ignored</span>
                        <span class="meta-row__value ir-count">${(rule.ignore_count || 0).toLocaleString()}</span>
                    </div>
                </div>
                <div class="ir-section">
                    <div class="ir-section-title">Description</div>
                    <div class="meta-row__value">${escapeHtml(desc)}</div>
                </div>
            `;

            const drawer = getRuleDrawer();
            if (drawer) {
                drawer.setTitle('Ignore Rule').setMeta('').setBody(body).open();
                return;
            }
            console.warn('Drawer component not loaded');
        }

        function closeRuleSidebar() {
            if (ruleDrawer) ruleDrawer.close();
        }
    </script>
</body>
</html>
