<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ignored Folders - File Indexer</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .ignored-stats {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .ignored-stat {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px 24px;
            text-align: center;
            min-width: 160px;
        }
        .ignored-stat .value {
            font-size: 32px;
            font-weight: 700;
            color: #333;
            margin-bottom: 4px;
        }
        .ignored-stat .label {
            font-size: 13px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .ignored-stat.rules .value { color: #007bff; }
        .ignored-stat.skipped .value { color: #dc3545; }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            margin-top: 32px;
        }
        table th { text-align: left; }
        .condition-tag {
            display: inline-block;
            background: #e8f4fd;
            color: #0c5460;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 12px;
            font-family: monospace;
        }

        /* Ignore Rule detail sidebar */
        #rules-table tbody tr { cursor: pointer; }
        .ir-sidebar-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.3); z-index: 999;
            opacity: 0; transition: opacity 0.2s; display: none;
        }
        .ir-sidebar-overlay.open { opacity: 1; display: block; }
        .ir-sidebar {
            position: fixed; top: 0; right: 0;
            width: 450px; max-width: 90vw; height: 100vh;
            background: white;
            box-shadow: -4px 0 20px rgba(0,0,0,0.15);
            display: flex; flex-direction: column;
            transform: translateX(100%); transition: transform 0.25s ease;
            z-index: 1000;
        }
        .ir-sidebar.open { transform: translateX(0); }
        .ir-header {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 1rem 1.25rem; border-bottom: 1px solid #eee;
        }
        .ir-close {
            background: none; border: none; font-size: 1.3rem;
            cursor: pointer; color: #666; padding: 0.25rem;
        }
        .ir-close:hover { color: #333; }
        .ir-title {
            font-size: 1.1rem; font-weight: 600; color: #2c3e50;
            flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .ir-body { flex: 1; overflow-y: auto; padding: 1rem 1.25rem; }
        .ir-section { margin-bottom: 1.25rem; }
        .ir-section-title {
            font-size: 0.75rem; font-weight: 600; color: #888;
            text-transform: uppercase; letter-spacing: 0.03em;
            margin-bottom: 0.5rem;
        }
        .ir-rule-code {
            font-family: monospace; font-size: 0.8rem;
            background: #f5f5f5; padding: 0.5rem 0.75rem; border-radius: 4px;
            border: 1px solid #eee; color: #333; word-break: break-all;
        }
        .ir-meta-row {
            display: flex; align-items: baseline; gap: 0.75rem;
            margin-bottom: 0.5rem;
        }
        .ir-meta-row:last-child { margin-bottom: 0; }
        .ir-meta-label {
            font-size: 0.75rem; font-weight: 600; color: #888;
            text-transform: uppercase; letter-spacing: 0.03em;
            width: 110px; flex-shrink: 0;
        }
        .ir-meta-value {
            font-size: 0.85rem; color: #333; word-break: break-all;
        }
        .ir-count { font-size: 1.8rem; font-weight: 700; color: #007bff; }
    </style>
</head>
<body>
    <nav id="sidebar-container"></nav>

    <main>
        <section class="ignored-stats">
            <div class="ignored-stat rules">
                <div class="value" id="stat-rules">-</div>
                <div class="label">Ignore Rules</div>
            </div>
            <div class="ignored-stat skipped">
                <div class="value" id="stat-skipped">-</div>
                <div class="label">Skipped Paths</div>
            </div>
        </section>

        <div class="section-title">Ignore Rules</div>
        <section class="results">
            <div id="no-rules" style="display:none;">No ignore rules configured</div>
            <table id="rules-table" style="display:none;">
                <thead>
                    <tr>
                        <th>Folder Name</th>
                        <th>Condition File</th>
                        <th>Description</th>
                        <th>Ignored Count</th>
                    </tr>
                </thead>
                <tbody id="rules-body"></tbody>
            </table>
        </section>

        <div class="section-title">Skipped Paths</div>
        <section class="results">
            <div id="no-skipped" style="display:none;">No skipped paths</div>
            <table id="skipped-table" style="display:none;">
                <thead>
                    <tr>
                        <th>Path</th>
                        <th>Error</th>
                    </tr>
                </thead>
                <tbody id="skipped-body"></tbody>
            </table>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const noRules = document.getElementById('no-rules');
            const rulesTable = document.getElementById('rules-table');
            const rulesBody = document.getElementById('rules-body');
            const noSkipped = document.getElementById('no-skipped');
            const skippedTable = document.getElementById('skipped-table');
            const skippedBody = document.getElementById('skipped-body');

            // Load ignore rules
            try {
                const res = await fetch('/api/settings');
                const data = await res.json();
                const rules = data.ignore_folders || [];

                document.getElementById('stat-rules').textContent = rules.length;

                if (rules.length === 0) {
                    noRules.style.display = 'block';
                } else {
                    rulesTable.style.display = 'table';
                    rules.forEach(r => {
                        const tr = document.createElement('tr');
                        const condition = r.condition
                            ? `<span class="condition-tag">${escapeHtml(r.condition)}</span>`
                            : '<span style="color:#999">—</span>';
                        const desc = r.condition
                            ? `Skip ${escapeHtml(r.name)} if ${escapeHtml(r.condition)} exists`
                            : `Skip all ${escapeHtml(r.name)} folders`;
                        tr.innerHTML = `
                            <td><code>${escapeHtml(r.name)}</code></td>
                            <td>${condition}</td>
                            <td>${desc}</td>
                            <td>${(r.ignore_count || 0).toLocaleString()}</td>
                        `;
                        tr.addEventListener('click', () => openRuleSidebar(r));
                        rulesBody.appendChild(tr);
                    });
                }
            } catch (err) {
                noRules.textContent = 'Failed to load ignore rules';
                noRules.style.display = 'block';
            }

            // Load skipped paths
            try {
                const res = await fetch('/api/skipped');
                const data = await res.json();

                document.getElementById('stat-skipped').textContent = data.length;

                if (data.length === 0) {
                    noSkipped.style.display = 'block';
                } else {
                    skippedTable.style.display = 'table';
                    data.forEach(item => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><code>${escapeHtml(item.path)}</code></td>
                            <td>${escapeHtml(item.error)}</td>
                        `;
                        skippedBody.appendChild(tr);
                    });
                }
            } catch (err) {
                noSkipped.textContent = 'Failed to load skipped paths';
                noSkipped.style.display = 'block';
            }
        });

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Ignore Rule detail sidebar
        let ruleSidebar = null;

        function openRuleSidebar(rule) {
            closeRuleSidebar();

            const overlay = document.createElement('div');
            overlay.className = 'ir-sidebar-overlay';
            overlay.onclick = closeRuleSidebar;

            const sidebar = document.createElement('div');
            sidebar.className = 'ir-sidebar';

            const raw = rule.condition ? `${rule.name}:${rule.condition}` : rule.name;
            const desc = rule.condition
                ? `Skip ${rule.name} if ${rule.condition} exists`
                : `Skip all ${rule.name} folders`;

            sidebar.innerHTML = `
                <div class="ir-header">
                    <button class="ir-close" onclick="closeRuleSidebar()">&times;</button>
                    <span class="ir-title">Ignore Rule</span>
                </div>
                <div class="ir-body">
                    <div class="ir-section">
                        <div class="ir-section-title">Rule</div>
                        <div class="ir-rule-code">${escapeHtml(raw)}</div>
                    </div>
                    <div class="ir-section">
                        <div class="ir-meta-row">
                            <span class="ir-meta-label">Folder Name</span>
                            <span class="ir-meta-value"><code>${escapeHtml(rule.name)}</code></span>
                        </div>
                        <div class="ir-meta-row">
                            <span class="ir-meta-label">Condition</span>
                            <span class="ir-meta-value">${
                                rule.condition
                                    ? `<span class="condition-tag">${escapeHtml(rule.condition)}</span>`
                                    : '<span style="color:#999">—</span>'
                            }</span>
                        </div>
                        <div class="ir-meta-row">
                            <span class="ir-meta-label">Ignored Count</span>
                            <span class="ir-meta-value ir-count">${(rule.ignore_count || 0).toLocaleString()}</span>
                        </div>
                    </div>
                    <div class="ir-section">
                        <div class="ir-section-title">Description</div>
                        <div class="ir-meta-value">${escapeHtml(desc)}</div>
                    </div>
                </div>
            `;

            document.body.appendChild(overlay);
            document.body.appendChild(sidebar);
            ruleSidebar = { overlay, sidebar };

            requestAnimationFrame(() => {
                overlay.classList.add('open');
                sidebar.classList.add('open');
            });
        }

        function closeRuleSidebar() {
            if (!ruleSidebar) return;
            ruleSidebar.overlay.remove();
            ruleSidebar.sidebar.remove();
            ruleSidebar = null;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeRuleSidebar();
        });
    </script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/status.js"></script>
</body>
</html>
