<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      (function () {
        try {
          var t = localStorage.getItem('fi-theme') || 'system';
          var d = t === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : t;
          document.documentElement.setAttribute('data-theme', d);
          document.documentElement.setAttribute('data-theme-pref', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        try {
          var n = localStorage.getItem('fi-nav-layout');
          if (n !== 'sidebar' && n !== 'topbar') n = 'sidebar';
          document.documentElement.setAttribute('data-nav-layout', n);
        } catch (e) {
          document.documentElement.setAttribute('data-nav-layout', 'sidebar');
        }
      })();
    </script>
    <title>Dashboard - File Indexer</title>
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        .chart-section {
            background: var(--bg-elevated);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-lg);
            padding: var(--space-5);
            margin-bottom: var(--space-6);
            box-shadow: var(--shadow-xs);
        }
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--space-4);
            flex-wrap: wrap;
            gap: var(--space-3);
        }
        .chart-header h2 {
            margin: 0;
            font-size: var(--font-size-lg);
            font-weight: 600;
            letter-spacing: var(--tracking-tight);
            color: var(--text-primary);
        }
        .chart-controls-row {
            display: flex;
            gap: var(--space-3);
            flex-wrap: wrap;
            align-items: center;
        }
        .chart-container {
            position: relative;
            height: 360px;
        }
        .control-label {
            font-size: var(--font-size-xs);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            margin-right: 0.15rem;
        }
    </style>
</head>
<body>
    <nav id="sidebar-container"></nav>

    <main>
        <header class="page-header">
            <div class="page-header__titles">
                <h1 class="page-header__title">Dashboard</h1>
                <p class="page-header__subtitle">Overview of your indexed library</p>
            </div>
            <div class="page-header__actions">
                <button type="button" id="refresh-btn" class="btn btn--secondary btn--sm" onclick="refreshDashboard()">
                    Refresh
                </button>
            </div>
        </header>

        <div id="snapshot-info" class="info-bar">
            <span>Last snapshot: <strong id="snap-last">—</strong></span>
            <span>Behind: <strong id="snap-behind">—</strong> entries</span>
            <span>Next snapshot: <strong id="snap-next">—</strong></span>
        </div>

        <section class="stat-grid" id="stats-grid">
            <div class="stat-card">
                <div class="stat-card__value" id="stat-files">—</div>
                <div class="stat-card__label">Files</div>
            </div>
            <div class="stat-card">
                <div class="stat-card__value" id="stat-folders">—</div>
                <div class="stat-card__label">Folders</div>
            </div>
            <div class="stat-card">
                <div class="stat-card__value" id="stat-size">—</div>
                <div class="stat-card__label">Total Size</div>
            </div>
            <div class="stat-card">
                <div class="stat-card__value" id="stat-db">—</div>
                <div class="stat-card__label">DB Size</div>
            </div>
            <div class="stat-card stat-card--warning">
                <div class="stat-card__value" id="stat-dup-files">—</div>
                <div class="stat-card__label">Duplicate Files</div>
            </div>
            <div class="stat-card stat-card--warning">
                <div class="stat-card__value" id="stat-dup-file-groups">—</div>
                <div class="stat-card__label">Dup File Groups</div>
            </div>
            <div class="stat-card stat-card--purple">
                <div class="stat-card__value" id="stat-dup-folders">—</div>
                <div class="stat-card__label">Duplicate Folders</div>
            </div>
            <div class="stat-card stat-card--purple">
                <div class="stat-card__value" id="stat-dup-folder-groups">—</div>
                <div class="stat-card__label">Dup Folder Groups</div>
            </div>
            <div class="stat-card stat-card--danger">
                <div class="stat-card__value" id="stat-wasted">—</div>
                <div class="stat-card__label">Wasted Space</div>
            </div>
            <div class="stat-card">
                <div class="stat-card__value" id="stat-skipped">—</div>
                <div class="stat-card__label">Skipped Paths</div>
            </div>
            <div class="stat-card stat-card--clickable" onclick="location.href='/pages/ignored.html'">
                <div class="stat-card__value" id="stat-ignore-rules">—</div>
                <div class="stat-card__label">Ignore Rules</div>
            </div>
        </section>

        <section class="chart-section" style="margin-top: var(--space-5);">
            <div class="chart-header">
                <h2>Files Over Time</h2>
                <div class="chart-controls-row">
                    <div class="segmented" role="group" aria-label="Metric">
                        <button type="button" class="segmented__btn" data-metric="files" onclick="setMetric('files')">Files</button>
                        <button type="button" class="segmented__btn" data-metric="folders" onclick="setMetric('folders')">Folders</button>
                        <button type="button" class="segmented__btn" data-metric="size" onclick="setMetric('size')">Size</button>
                        <button type="button" class="segmented__btn active" data-metric="all" onclick="setMetric('all')">All</button>
                    </div>
                    <div class="segmented" role="group" aria-label="Interval">
                        <button type="button" class="segmented__btn" data-interval="day" onclick="setInterval('day')">Day</button>
                        <button type="button" class="segmented__btn" data-interval="week" onclick="setInterval('week')">Week</button>
                        <button type="button" class="segmented__btn" data-interval="month" onclick="setInterval('month')">Month</button>
                        <button type="button" class="segmented__btn active" data-interval="year" onclick="setInterval('year')">Year</button>
                    </div>
                    <div class="segmented" role="group" aria-label="Chart type">
                        <button type="button" class="segmented__btn" data-type="bar" onclick="setChartType('bar')">Bar</button>
                        <button type="button" class="segmented__btn active" data-type="line" onclick="setChartType('line')">Line</button>
                        <button type="button" class="segmented__btn" data-type="pie" onclick="setChartType('pie')">Pie</button>
                        <button type="button" class="segmented__btn" data-type="doughnut" onclick="setChartType('doughnut')">Doughnut</button>
                    </div>
                    <div class="segmented" role="group" aria-label="Size unit" id="chart-size-unit">
                        <button type="button" class="segmented__btn" data-size-unit-option="auto">Auto</button>
                        <button type="button" class="segmented__btn" data-size-unit-option="B">B</button>
                        <button type="button" class="segmented__btn" data-size-unit-option="KB">KB</button>
                        <button type="button" class="segmented__btn" data-size-unit-option="MB">MB</button>
                        <button type="button" class="segmented__btn" data-size-unit-option="GB">GB</button>
                        <button type="button" class="segmented__btn" data-size-unit-option="TB">TB</button>
                    </div>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="timeline-chart"></canvas>
            </div>
        </section>
    </main>

    <script>
        let chart = null;
        let currentInterval = 'year';
        let currentChartType = 'line';
        let currentMetric = 'all';
        let timelineData = [];

        function chartColors() {
            const style = getComputedStyle(document.documentElement);
            const read = (name, fallback) => style.getPropertyValue(name).trim() || fallback;
            return {
                text: read('--text-secondary', '#94a3b8'),
                grid: read('--border-subtle', '#1e2430'),
                files: 'rgba(99, 102, 241, 0.85)',
                filesBorder: '#6366f1',
                folders: 'rgba(139, 92, 246, 0.85)',
                foldersBorder: '#8b5cf6',
                size: 'rgba(16, 185, 129, 0.85)',
                sizeBorder: '#10b981',
                sizeCum: 'rgba(245, 158, 11, 0.85)',
                sizeCumBorder: '#f59e0b',
            };
        }

        /** Running total of file size across timeline buckets (in order). */
        function cumulativeSizes() {
            let sum = 0;
            return timelineData.map((b) => {
                sum += Number(b.size) || 0;
                return sum;
            });
        }

        /**
         * Resolve a single unit for the whole chart so the scale is consistent.
         * Auto picks the largest unit based on max period/cumulative size.
         */
        function chartSizeScale() {
            const UNITS = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'];
            const base = 1024;
            const pref = (window.SizeFormat && SizeFormat.get()) || 'auto';
            const period = timelineData.map((b) => Number(b.size) || 0);
            const cum = cumulativeSizes();
            const maxBytes = Math.max(1, ...period, ...cum);

            let idx;
            if (pref === 'auto') {
                idx = Math.floor(Math.log(maxBytes) / Math.log(base));
                idx = Math.max(0, Math.min(idx, UNITS.length - 1));
            } else {
                idx = Math.max(0, UNITS.indexOf(pref));
                if (idx < 0) idx = 0;
            }
            return {
                unit: UNITS[idx],
                divisor: Math.pow(base, idx),
            };
        }

        function bytesToChartUnit(bytes, scale) {
            return (Number(bytes) || 0) / scale.divisor;
        }

        function formatChartSize(valueInUnit, scale) {
            const n = Number(valueInUnit) || 0;
            if (scale.unit === 'B') return `${Math.round(n).toLocaleString()} B`;
            const text = n >= 100
                ? n.toFixed(1).replace(/\.0$/, '')
                : n.toFixed(2).replace(/\.?0+$/, '');
            return `${text} ${scale.unit}`;
        }

        function refreshSizeDisplays() {
            // Re-format stat cards if we already have last payload
            if (lastDashboard) {
                document.getElementById('stat-size').textContent = formatSize(lastDashboard.total_size);
                document.getElementById('stat-db').textContent = formatSize(lastDashboard.db_size);
                document.getElementById('stat-wasted').textContent = formatSize(lastDashboard.wasted_file_bytes);
            }
            if (timelineData.length) renderChart();
            if (window.SizeFormat) SizeFormat.updateUI(SizeFormat.get());
        }

        let lastDashboard = null;

        document.addEventListener('DOMContentLoaded', () => {
            if (window.SizeFormat) SizeFormat.updateUI(SizeFormat.get());
            fetchDashboard();
        });
        document.addEventListener('themechange', () => {
            if (timelineData.length) renderChart();
        });
        document.addEventListener('sizeunitchange', () => {
            refreshSizeDisplays();
        });

        async function fetchDashboard() {
            try {
                const res = await fetch(`/api/dashboard?interval=${currentInterval}`);
                const data = await res.json();
                lastDashboard = data;

                document.getElementById('stat-files').textContent = data.total_files.toLocaleString();
                document.getElementById('stat-folders').textContent = data.total_folders.toLocaleString();
                document.getElementById('stat-size').textContent = formatSize(data.total_size);
                document.getElementById('stat-db').textContent = formatSize(data.db_size);
                document.getElementById('stat-dup-files').textContent = data.duplicate_files.toLocaleString();
                document.getElementById('stat-dup-file-groups').textContent = data.duplicate_file_groups.toLocaleString();
                document.getElementById('stat-dup-folders').textContent = data.duplicate_folders.toLocaleString();
                document.getElementById('stat-dup-folder-groups').textContent = data.duplicate_folder_groups.toLocaleString();
                document.getElementById('stat-wasted').textContent = formatSize(data.wasted_file_bytes);
                document.getElementById('stat-skipped').textContent = data.skipped_paths.toLocaleString();
                document.getElementById('stat-ignore-rules').textContent = data.ignore_rules_count.toLocaleString();

                if (data.last_refreshed) {
                    const date = new Date(data.last_refreshed * 1000);
                    document.getElementById('snap-last').textContent = date.toLocaleTimeString();
                } else {
                    document.getElementById('snap-last').textContent = 'Never';
                }

                const behind = data.entries_behind || 0;
                const behindEl = document.getElementById('snap-behind');
                behindEl.textContent = behind.toLocaleString();
                behindEl.style.color = behind > 0 ? 'var(--danger)' : 'var(--success)';

                if (data.next_refresh) {
                    const next = new Date(data.next_refresh * 1000);
                    document.getElementById('snap-next').textContent = next.toLocaleTimeString();
                } else {
                    document.getElementById('snap-next').textContent = 'Auto-refresh off';
                }

                timelineData = data.timeline;
                renderChart();
            } catch (err) {
                console.error('Failed to load dashboard:', err);
            }
        }

        function renderChart() {
            const ctx = document.getElementById('timeline-chart').getContext('2d');
            if (chart) chart.destroy();

            const c = chartColors();
            const labels = timelineData.map(b => b.label);
            const isPie = currentChartType === 'pie' || currentChartType === 'doughnut';
            const sizeScale = chartSizeScale();
            const showSize = currentMetric === 'size' || currentMetric === 'all';

            let datasets;
            if (isPie) {
                const metricData = getMetricData(currentMetric, sizeScale);
                datasets = [{
                    data: metricData,
                    backgroundColor: generateColors(metricData.length),
                    borderWidth: 0,
                }];
            } else {
                datasets = [];
                if (currentMetric === 'files' || currentMetric === 'all') {
                    datasets.push({
                        label: 'Files',
                        data: timelineData.map(b => b.files),
                        backgroundColor: currentChartType === 'line' ? 'rgba(99, 102, 241, 0.12)' : c.files,
                        borderColor: c.filesBorder,
                        borderWidth: 2,
                        fill: currentChartType === 'line',
                        tension: 0.35,
                        pointRadius: 2,
                        pointHoverRadius: 5,
                    });
                }
                if (currentMetric === 'folders' || currentMetric === 'all') {
                    datasets.push({
                        label: 'Folders',
                        data: timelineData.map(b => b.folders),
                        backgroundColor: currentChartType === 'line' ? 'rgba(139, 92, 246, 0.12)' : c.folders,
                        borderColor: c.foldersBorder,
                        borderWidth: 2,
                        fill: currentChartType === 'line',
                        tension: 0.35,
                        pointRadius: 2,
                        pointHoverRadius: 5,
                    });
                }
                if (showSize) {
                    const periodSized = timelineData.map((b) => bytesToChartUnit(b.size, sizeScale));
                    const cumSized = cumulativeSizes().map((b) => bytesToChartUnit(b, sizeScale));
                    datasets.push({
                        label: `Size (period) · ${sizeScale.unit}`,
                        data: periodSized,
                        backgroundColor: currentChartType === 'line' ? 'rgba(16, 185, 129, 0.12)' : c.size,
                        borderColor: c.sizeBorder,
                        borderWidth: 2,
                        fill: currentChartType === 'line',
                        tension: 0.35,
                        pointRadius: 2,
                        pointHoverRadius: 5,
                        yAxisID: currentMetric === 'all' ? 'y1' : 'y',
                        isSize: true,
                    });
                    datasets.push({
                        type: 'line',
                        label: `Total size (accumulated) · ${sizeScale.unit}`,
                        data: cumSized,
                        backgroundColor: 'rgba(245, 158, 11, 0.08)',
                        borderColor: c.sizeCumBorder,
                        borderWidth: 2.5,
                        borderDash: [6, 4],
                        fill: false,
                        tension: 0.25,
                        pointRadius: 2,
                        pointHoverRadius: 5,
                        yAxisID: currentMetric === 'all' ? 'y1' : 'y',
                        order: 0,
                        isSize: true,
                    });
                }
            }

            const sizeAxis = {
                beginAtZero: true,
                position: currentMetric === 'all' ? 'right' : 'left',
                grid: currentMetric === 'all' ? { drawOnChartArea: false } : { color: c.grid },
                border: { color: c.grid },
                title: {
                    display: true,
                    text: sizeScale.unit,
                    color: c.text,
                },
                ticks: {
                    color: c.text,
                    callback: (v) => {
                        if (sizeScale.unit === 'B') return Number(v).toLocaleString();
                        const n = Number(v);
                        return n >= 100 ? n.toFixed(0) : n.toFixed(1).replace(/\.0$/, '');
                    },
                },
            };

            const scales = isPie ? {} : {
                x: {
                    ticks: { maxRotation: 45, minRotation: 30, color: c.text },
                    grid: { color: c.grid },
                    border: { color: c.grid },
                },
                ...(currentMetric === 'size'
                    ? { y: sizeAxis }
                    : {
                        y: {
                            beginAtZero: true,
                            position: 'left',
                            ticks: { color: c.text },
                            grid: { color: c.grid },
                            border: { color: c.grid },
                        },
                        ...(showSize ? { y1: sizeAxis } : {}),
                    }),
            };

            chart = new Chart(ctx, {
                type: currentChartType,
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: {
                            display: currentMetric === 'all' || currentMetric === 'size' || isPie,
                            labels: { color: c.text, boxWidth: 12, usePointStyle: true },
                        },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => {
                                    if (isPie) {
                                        if (currentMetric === 'size') {
                                            return `${ctx.label}: ${formatChartSize(ctx.parsed, sizeScale)}`;
                                        }
                                        return `${ctx.label}: ${ctx.parsed.toLocaleString()}`;
                                    }
                                    const val = ctx.parsed.y ?? ctx.parsed;
                                    if (ctx.dataset.isSize) {
                                        return `${ctx.dataset.label.split(' · ')[0]}: ${formatChartSize(val, sizeScale)}`;
                                    }
                                    return `${ctx.dataset.label}: ${val.toLocaleString()}`;
                                }
                            }
                        },
                    },
                    scales,
                },
            });
        }

        function getMetricData(metric, sizeScale) {
            if (metric === 'files') return timelineData.map(b => b.files);
            if (metric === 'folders') return timelineData.map(b => b.folders);
            if (metric === 'size') {
                const scale = sizeScale || chartSizeScale();
                return timelineData.map((b) => bytesToChartUnit(b.size, scale));
            }
            return timelineData.map(b => b.files + b.folders);
        }

        function generateColors(count) {
            const palette = [
                '#6366f1', '#8b5cf6', '#10b981', '#f97316', '#ef4444',
                '#0ea5e9', '#f59e0b', '#a78bfa', '#34d399', '#f472b6',
            ];
            return Array.from({ length: count }, (_, i) => palette[i % palette.length]);
        }

        function setInterval(interval) {
            currentInterval = interval;
            document.querySelectorAll('[data-interval]').forEach(b => b.classList.toggle('active', b.dataset.interval === interval));
            fetchDashboard();
        }

        function setChartType(type) {
            currentChartType = type;
            document.querySelectorAll('[data-type]').forEach(b => b.classList.toggle('active', b.dataset.type === type));
            renderChart();
        }

        function setMetric(metric) {
            currentMetric = metric;
            document.querySelectorAll('[data-metric]').forEach(b => b.classList.toggle('active', b.dataset.metric === metric));
            renderChart();
        }

        function formatSize(bytes) {
            if (window.SizeFormat) return window.SizeFormat.format(bytes);
            if (bytes === 0 || bytes === '0') return '0 B';
            const n = Number(bytes);
            if (!Number.isFinite(n) || n < 0) return '—';
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.min(Math.floor(Math.log(Math.max(n, 1)) / Math.log(1024)), units.length - 1);
            const value = n / Math.pow(1024, i);
            const text = i === 0 ? String(Math.round(value)) : value.toFixed(2).replace(/\.?0+$/, '');
            return text + ' ' + units[i];
        }

        async function refreshDashboard() {
            const btn = document.getElementById('refresh-btn');
            btn.disabled = true;
            btn.textContent = 'Refreshing…';

            try {
                await fetch('/api/dashboard/refresh', { method: 'POST' });
                await fetchDashboard();
            } catch (err) {
                console.error('Failed to refresh dashboard:', err);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Refresh';
            }
        }
    </script>
    <script src="/assets/js/core/theme.js"></script>
    <script src="/assets/js/core/format.js"></script>
    <script src="/assets/js/core/drawer.js"></script>
    <script src="/assets/js/core/sidebar.js"></script>
    <script src="/assets/js/core/status.js"></script>
</body>
</html>
