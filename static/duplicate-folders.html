<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duplicate Folders - File Indexer</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/duplicate-folders.css">
</head>
<body>
    <header>
        <h1>File Indexer</h1>
        <nav>
            <a href="/">Dashboard</a>
            <a href="/search.html">Search</a>
            <a href="/duplicates.html">Duplicates</a>
            <a href="/duplicate-folders.html" class="active">Folders</a>
            <a href="/explorer.html">Explorer</a>
            <a href="/skipped.html">Skipped</a>
            <a href="/logs.html">Logs</a>
            <a href="/status.html">Status</a>
            <a href="/settings.html">Settings</a>
            <a href="/ignored.html">Ignored</a>
            <span id="status-dot" class="status-dot idle" title="Idle"></span>
        </nav>
    </header>

    <main>
        <div class="filter-bar">
            <input type="text" id="filter-input" placeholder="Filter by folder or file name..." onkeydown="if(event.key==='Enter')applyFilter()">
            <label>
                <input type="checkbox" id="min-shared" onchange="applyFilter()">
                Min 2 shared
            </label>
            <label class="align-toggle">
                <input type="checkbox" id="align-files" onchange="applyFilter()">
                Align shared files
            </label>
            <button class="merge-folders-btn" onclick="applyFilter()" style="background:#3498db">Search</button>
        </div>
        <div class="summary" id="summary"></div>
        <div id="groups"></div>
        <div class="pagination" id="pagination"></div>
    </main>

    <div class="merge-overlay" id="merge-overlay" style="display:none;">
        <div class="merge-panel">
            <div class="merge-header">
                <h2>Merge Duplicate Folders</h2>
                <div class="merge-view-toggle">
                    <button class="merge-view-btn" id="view-summary-btn" onclick="setMergeView('summary')">Summary</button>
                    <button class="merge-view-btn" id="view-list-btn" onclick="setMergeView('list')">List</button>
                    <button class="merge-view-btn active" id="view-tree-btn" onclick="setMergeView('tree')">Tree</button>
                </div>
                <button class="merge-close" onclick="closeMerge()">&times;</button>
            </div>
            <div class="merge-dest">
                <label>Destination:</label>
                <input type="text" id="merge-dest-path" placeholder="/path/to/merged/output">
            </div>
            <div class="merge-body" id="merge-body"></div>
            <div class="merge-footer">
                <span class="merge-stats" id="merge-stats"></span>
                <button class="merge-apply" id="merge-apply" onclick="applyMerge()">Apply Merge</button>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/duplicate-folders.js"></script>
    <script src="/js/file-viewer.js"></script>
    <script src="/js/status.js"></script>
</body>
</html>
