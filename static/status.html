<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      (function () {
        try {
          var t = localStorage.getItem('fi-theme') || 'system';
          var d = t === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : t;
          document.documentElement.setAttribute('data-theme', d);
          document.documentElement.setAttribute('data-theme-pref', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <title>Status - File Indexer</title>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .status-hero {
            text-align: center;
            padding: var(--space-8) var(--space-4);
        }
        .status-hero .dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: inline-block;
            margin-bottom: var(--space-3);
        }
        .status-hero .dot.idle {
            background: var(--success);
            box-shadow: 0 0 0 6px var(--success-muted);
        }
        .status-hero .dot.indexing {
            background: var(--warning);
            box-shadow: 0 0 0 6px var(--warning-muted);
            animation: badge-pulse 1s ease-in-out infinite;
        }
        .status-hero .dot.error {
            background: var(--danger);
            box-shadow: 0 0 0 6px var(--danger-muted);
        }
        .status-hero .text {
            font-size: var(--font-size-2xl);
            font-weight: 650;
            letter-spacing: var(--tracking-tight);
        }
        .status-hero .text.idle { color: var(--success); }
        .status-hero .text.indexing { color: var(--warning); }
        .status-hero .text.error { color: var(--danger); }

        .status-row {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            margin-bottom: var(--space-3);
        }
        .status-row:last-of-type { margin-bottom: 0; }
        .status-label {
            color: var(--text-muted);
            min-width: 120px;
            font-size: var(--font-size-sm);
            font-weight: 500;
        }
        .status-value {
            font-weight: 550;
            font-size: var(--font-size-base);
            color: var(--text-primary);
        }
        .status-value.idle { color: var(--success); }
        .status-value.indexing { color: var(--warning); }

        .dir-display {
            font-family: var(--font-mono);
            font-size: var(--font-size-sm);
            color: var(--text-primary);
            background: var(--bg-muted);
            border: 1px solid var(--border-default);
            padding: 0.65rem 0.85rem;
            border-radius: var(--radius-sm);
            word-break: break-all;
            margin-top: var(--space-2);
        }

        .status-progress {
            margin-top: var(--space-4);
        }
    </style>
</head>
<body>
    <nav id="sidebar-container"></nav>

    <main>
        <header class="page-header">
            <div class="page-header__titles">
                <h1 class="page-header__title">Status</h1>
                <p class="page-header__subtitle">Live indexing state</p>
            </div>
        </header>

        <div class="card" style="margin-bottom: var(--space-4);">
            <div class="status-hero">
                <div class="dot idle" id="big-dot"></div>
                <div class="text idle" id="big-text">Idle</div>
            </div>
        </div>

        <div class="card" style="margin-bottom: var(--space-4);">
            <div class="card__header">
                <h2 class="card__title">Indexing Progress</h2>
            </div>
            <div class="card__body">
                <div class="status-row">
                    <span class="status-label">Status</span>
                    <span class="status-value" id="status">—</span>
                </div>
                <div class="status-row">
                    <span class="status-label">Entries</span>
                    <span class="status-value" id="entries">—</span>
                </div>
                <div class="status-row">
                    <span class="status-label">Elapsed</span>
                    <span class="status-value" id="elapsed">—</span>
                </div>
                <div class="status-progress">
                    <div class="progress">
                        <div class="progress__bar" id="progress-bar" style="width:0%"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card" id="current-dir-card" style="display:none;">
            <div class="card__header">
                <h2 class="card__title">Current Directory</h2>
            </div>
            <div class="card__body">
                <div class="dir-display" id="current-dir">—</div>
            </div>
        </div>
    </main>

    <script src="/js/theme.js"></script>
    <script src="/js/drawer.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/status.js"></script>
    <script>
        async function refreshStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();

                const bigDot = document.getElementById('big-dot');
                const bigText = document.getElementById('big-text');
                const status = document.getElementById('status');
                const entries = document.getElementById('entries');
                const elapsed = document.getElementById('elapsed');
                const progressBar = document.getElementById('progress-bar');
                const currentDirCard = document.getElementById('current-dir-card');
                const currentDir = document.getElementById('current-dir');

                bigDot.className = 'dot ' + data.status;
                bigText.className = 'text ' + data.status;
                bigText.textContent = data.status === 'indexing' ? 'Indexing…' : 'Idle';
                bigText.style.color = '';

                status.textContent = data.status;
                status.className = 'status-value ' + data.status;
                entries.textContent = data.total_entries.toLocaleString();

                if (data.elapsed_secs !== null) {
                    const secs = Math.floor(data.elapsed_secs);
                    const mins = Math.floor(secs / 60);
                    const remainSecs = secs % 60;
                    elapsed.textContent = mins > 0 ? `${mins}m ${remainSecs}s` : `${remainSecs}s`;
                } else {
                    elapsed.textContent = '—';
                }

                if (data.status === 'indexing') {
                    progressBar.classList.add('progress__bar--active');
                    progressBar.style.width = '100%';
                    currentDirCard.style.display = '';
                    currentDir.textContent = data.current_dir || '…';
                } else {
                    progressBar.classList.remove('progress__bar--active');
                    progressBar.style.width = '0%';
                    currentDirCard.style.display = 'none';
                    if (statusInterval) {
                        clearInterval(statusInterval);
                        statusInterval = null;
                    }
                }
            } catch (e) {
                document.getElementById('big-dot').className = 'dot error';
                document.getElementById('big-text').textContent = 'Server unreachable';
                document.getElementById('big-text').className = 'text error';
            }
        }

        let statusInterval = null;
        document.addEventListener('DOMContentLoaded', () => {
            refreshStatus();
            statusInterval = setInterval(refreshStatus, 2000);
        });
    </script>
</body>
</html>
