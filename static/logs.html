<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs - File Indexer</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .log-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .log-controls select, .log-controls input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .log-controls input[type="text"] {
            width: 220px;
        }
        .log-controls button {
            padding: 8px 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .log-controls button:hover {
            background: #0056b3;
        }
        .log-controls button.active {
            background: #0056b3;
        }
        .log-table {
            width: 100%;
            border-collapse: collapse;
            font-family: monospace;
        }
        .log-table th, .log-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        .log-table th {
            background: #f5f5f5;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        .log-table th:hover {
            background: #e9ecef;
        }
        .log-table tr:hover {
            background: #f9f9f9;
        }
        .level-error { color: #dc3545; font-weight: bold; }
        .level-warn { color: #ffc107; font-weight: bold; }
        .level-info { color: #17a2b8; }
        .level-debug { color: #6c757d; }
        .timestamp { color: #666; white-space: nowrap; }
        .message { word-break: break-word; }
        .indexed-row {
            cursor: pointer;
        }
        .indexed-row:hover {
            background: #eef6ff !important;
        }
        .expand-icon {
            display: inline-block;
            width: 1rem;
            text-align: center;
            color: #999;
            transition: transform 0.15s;
            flex-shrink: 0;
        }
        .expand-icon.open {
            transform: rotate(90deg);
        }
        .file-list-row td {
            padding: 0 !important;
        }
        .file-list {
            padding: 0.25rem 1rem 0.5rem 2.5rem;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
            font-size: 0.8rem;
        }
        .file-list-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.15rem 0;
            color: #555;
        }
        .file-list-item .fl-name {
            font-family: monospace;
        }
        .file-list-item .fl-size {
            color: #999;
            margin-left: auto;
            font-family: monospace;
            font-size: 0.75rem;
        }
        .file-list-toggle {
            font-size: 0.75rem;
            color: #3498db;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0.15rem 0;
            margin-top: 0.15rem;
        }
        .file-list-toggle:hover { text-decoration: underline; }
        #no-results {
            display: none;
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .search-hint {
            font-size: 12px;
            color: #999;
            margin-top: -8px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>File Indexer</h1>
        <nav>
            <a href="/">Dashboard</a>
            <a href="/search.html">Search</a>
            <a href="/duplicates.html">Duplicates</a>
            <a href="/duplicate-folders.html">Folders</a>
            <a href="/explorer.html">Explorer</a>
            <a href="/skipped.html">Skipped</a>
            <a href="/logs.html" class="active">Logs</a>
            <a href="/status.html">Status</a>
            <a href="/settings.html">Settings</a>
            <a href="/ignored.html">Ignored</a>
            <span id="status-dot" class="status-dot idle" title="Idle"></span>
        </nav>
    </header>

    <main>
        <section class="log-controls">
            <label>Level:
                <select id="level-filter">
                    <option value="all">All</option>
                    <option value="ERROR">Error</option>
                    <option value="WARN">Warning</option>
                    <option value="INFO">Info</option>
                    <option value="DEBUG">Debug</option>
                </select>
            </label>
            <label>Search:
                <input type="text" id="search-filter" placeholder="message contains...">
            </label>
            <label>Limit:
                <select id="limit-filter">
                    <option value="100">100</option>
                    <option value="500" selected>500</option>
                    <option value="1000">1000</option>
                    <option value="5000">5000</option>
                </select>
            </label>
            <button id="sort-btn" onclick="toggleSort()">Timestamp ▼</button>
            <button onclick="fetchLogs()">Refresh</button>
            <div class="auto-refresh">
                <input type="checkbox" id="auto-refresh" onchange="toggleAutoRefresh()">
                <label for="auto-refresh">Auto-refresh (5s)</label>
            </div>
        </section>
        <div class="search-hint">Search: plain text = exact match, <code>prefix*</code> = starts with</div>

        <section class="results-info" id="results-info" style="display:none;">
            <span id="result-count"></span>
        </section>

        <section class="results">
            <table class="log-table" id="results-table" style="display:none;">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Level</th>
                        <th>Message</th>
                    </tr>
                </thead>
                <tbody id="results-body"></tbody>
            </table>
            <div id="no-results">No logs found</div>
        </section>
    </main>

    <script>
        let refreshInterval = null;
        let sortAsc = false;

        document.addEventListener('DOMContentLoaded', () => {
            fetchLogs();
            document.getElementById('level-filter').addEventListener('change', fetchLogs);
            document.getElementById('limit-filter').addEventListener('change', fetchLogs);
            document.getElementById('search-filter').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') fetchLogs();
            });
        });

        function toggleSort() {
            sortAsc = !sortAsc;
            document.getElementById('sort-btn').textContent = sortAsc ? 'Timestamp ▲' : 'Timestamp ▼';
            fetchLogs();
        }

        async function fetchLogs() {
            const limit = document.getElementById('limit-filter').value;
            const level = document.getElementById('level-filter').value;
            const search = document.getElementById('search-filter').value;
            const sort = sortAsc ? 'asc' : 'desc';

            try {
                const params = new URLSearchParams({ limit, sort });
                if (level !== 'all') params.set('level', level);
                if (search) params.set('search', search);

                const res = await fetch(`/api/logs?${params}`);
                const data = await res.json();
                lastData = data;

                const resultsTable = document.getElementById('results-table');
                const resultsBody = document.getElementById('results-body');
                const resultsInfo = document.getElementById('results-info');
                const resultCount = document.getElementById('result-count');
                const noResults = document.getElementById('no-results');

                resultsBody.innerHTML = '';

                if (data.length === 0) {
                    noResults.style.display = 'block';
                    resultsTable.style.display = 'none';
                    resultsInfo.style.display = 'none';
                    return;
                }

                noResults.style.display = 'none';
                resultsTable.style.display = 'table';
                resultCount.textContent = `${data.length} log(s)`;
                resultsInfo.style.display = 'block';

                data.forEach((log, idx) => {
                    const isIndexed = log.files && log.files.length > 0;
                    const tr = document.createElement('tr');
                    if (isIndexed) {
                        tr.className = 'indexed-row';
                        tr.dataset.idx = idx;
                        tr.onclick = () => toggleLogFile(idx);
                    }
                    tr.innerHTML = `
                        <td class="timestamp">${isIndexed ? '<span class="expand-icon" id="icon-' + idx + '">\u25B6</span>' : ''}${escapeHtml(log.timestamp)}</td>
                        <td class="level-${log.level.toLowerCase()}">${escapeHtml(log.level)}</td>
                        <td class="message">${escapeHtml(log.message)}</td>
                    `;
                    resultsBody.appendChild(tr);

                    if (isIndexed) {
                        const fileRow = document.createElement('tr');
                        fileRow.className = 'file-list-row';
                        fileRow.id = 'files-' + idx;
                        fileRow.style.display = 'none';
                        const MAX_SHOW = 50;
                        let fileHtml = '<td colspan="3"><div class="file-list">';
                        const files = log.files;
                        const shown = files.slice(0, MAX_SHOW);
                        shown.forEach(f => {
                            fileHtml += `<div class="file-list-item"><span class="fl-name">${escapeHtml(f.name)}</span><span class="fl-size">${formatSize(f.size)}</span></div>`;
                        });
                        if (files.length > MAX_SHOW) {
                            fileHtml += `<button class="file-list-toggle" onclick="event.stopPropagation(); expandAllFiles(${idx}, ${files.length})">Show all ${files.length} files...</button>`;
                        }
                        fileHtml += '</div></td>';
                        fileRow.innerHTML = fileHtml;
                        resultsBody.appendChild(fileRow);
                    }
                });
            } catch (err) {
                document.getElementById('no-results').textContent = 'Failed to load logs';
                document.getElementById('no-results').style.display = 'block';
            }
        }

        function toggleAutoRefresh() {
            if (document.getElementById('auto-refresh').checked) {
                refreshInterval = setInterval(fetchLogs, 5000);
            } else {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function toggleLogFile(idx) {
            const row = document.getElementById('files-' + idx);
            const icon = document.getElementById('icon-' + idx);
            if (!row) return;
            const isOpen = row.style.display !== 'none';
            row.style.display = isOpen ? 'none' : '';
            icon.classList.toggle('open', !isOpen);
        }

        function expandAllFiles(idx, total) {
            const row = document.getElementById('files-' + idx);
            if (!row) return;
            // Find the log entry in the cached data
            const log = lastData[idx];
            if (!log || !log.files) return;
            const list = row.querySelector('.file-list');
            list.innerHTML = log.files.map(f =>
                `<div class="file-list-item"><span class="fl-name">${escapeHtml(f.name)}</span><span class="fl-size">${formatSize(f.size)}</span></div>`
            ).join('');
        }

        let lastData = [];

        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return (bytes / Math.pow(1024, i)).toFixed(1) + ' ' + units[i];
        }
    </script>
    <script src="/js/status.js"></script>
</body>
</html>
